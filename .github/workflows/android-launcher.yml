name: Android Launcher APK

on:
  push:
    paths:
      - "android-launcher/**"
      - ".github/workflows/android-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-launcher
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 更新インストールできるよう、毎回同じ鍵で署名する。
      # Secret「LAUNCHER_KEYSTORE_B64」があればそれを使い、無ければ初回に作った鍵をキャッシュから使い回す
      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.launcher-signing
          key: launcher-signing-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.LAUNCHER_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LAUNCHER_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.launcher-signing
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.launcher-signing/secret.keystore
            echo "LAUNCHER_KEYSTORE=$HOME/.launcher-signing/secret.keystore" >> "$GITHUB_ENV"
            echo "LAUNCHER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            if [ ! -f ~/.launcher-signing/cached.keystore ]; then
              openssl rand -hex 24 > ~/.launcher-signing/password
              keytool -genkeypair -keystore ~/.launcher-signing/cached.keystore -storetype PKCS12 \
                -storepass "$(cat ~/.launcher-signing/password)" -keypass "$(cat ~/.launcher-signing/password)" \
                -alias ryotei -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=RYOTEI LAUNCHER"
            fi
            echo "::add-mask::$(cat ~/.launcher-signing/password)"
            echo "LAUNCHER_KEYSTORE=$HOME/.launcher-signing/cached.keystore" >> "$GITHUB_ENV"
            echo "LAUNCHER_KEYSTORE_PASSWORD=$(cat ~/.launcher-signing/password)" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ryotei-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ryotei-launcher
          path: android-launcher/ryotei-launcher.apk

      # スマホから直接ダウンロードできるよう、常に最新版を同じリリースに置き直す
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete launcher-latest --cleanup-tag --yes || true
          gh release create launcher-latest ryotei-launcher.apk \
            --target "$GITHUB_SHA" \
            --title "RYOTEI LAUNCHER (build ${{ github.run_number }})" \
            --notes "Androidのスマホでこのページを開き、ryotei-launcher.apk をダウンロードしてインストールしてください。ブランチ: ${GITHUB_REF_NAME}"
