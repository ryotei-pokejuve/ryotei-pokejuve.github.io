<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https://idnhamxtwxfcxflenxko.supabase.co;">
<title>INDEX CMS | RYOTEI</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d2327;background:#f0f0f1}*{box-sizing:border-box}body{margin:0}.top{height:48px;background:#1d2327;color:#fff;display:flex;align-items:center;padding:0 18px;gap:18px}.top a{color:#fff}.wrap{max-width:1280px;margin:24px auto;padding:0 16px}.panel{background:#fff;border:1px solid #c3c4c7;box-shadow:0 1px 1px rgba(0,0,0,.04);padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.field{display:block;margin-bottom:14px}.field span{display:block;font-weight:600;margin-bottom:6px}input,textarea,select,button{font:inherit}input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:9px 10px;border:1px solid #8c8f94;border-radius:2px;background:#fff}textarea{min-height:90px;resize:vertical}.btn{border:1px solid #2271b1;background:#2271b1;color:#fff;padding:8px 14px;border-radius:3px;cursor:pointer}.btn.secondary{background:#fff;color:#2271b1}.btn.danger{background:#b32d2e;border-color:#b32d2e}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.block{border:1px solid #dcdcde;background:#fff;padding:12px;margin-bottom:10px}.block-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.block-actions{display:flex;gap:6px;flex-wrap:wrap}.block img{max-width:100%;max-height:320px;object-fit:contain;display:block;margin:8px 0}.status{margin-top:10px;padding:10px;background:#f6f7f7;border-left:4px solid #2271b1;display:none}.status.error{border-left-color:#d63638}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button.active{background:#1d2327;border-color:#1d2327}.section{display:none}.section.active{display:block}.post-row,.history-row{padding:12px;border-bottom:1px solid #ddd}.post-row strong,.history-row strong{display:block}.meta{color:#646970;font-size:13px;margin:4px 0}.preview{background:#111;color:#eee;padding:18px;min-height:220px}.preview img{max-width:100%;height:auto}.preview figure{margin:16px 0}.preview figcaption{font-size:12px;color:#aaa}.preview h3{font-size:22px}.login{max-width:440px;margin:70px auto}.file-warning{background:#fcf0f1;border-left:4px solid #d63638;padding:12px;margin-bottom:18px;display:none}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top"><strong>RYOTEI INDEX CMS</strong><a href="index.html">サイトを見る</a><a href="admin.html">カード管理</a><button id="logout" class="btn secondary" style="margin-left:auto;display:none">ログアウト</button></div>
<div class="wrap">
<div id="file-warning" class="file-warning">この管理画面は file:// 直開きではなく、<strong>http://localhost:8000/index-admin.html</strong> または公開サイトのHTTPSから開いてください。</div>
<section id="login-box" class="panel login">
<h1>INDEX CMS ログイン</h1>
<label class="field"><span>メールアドレス</span><input id="email" type="email" autocomplete="username"></label>
<label class="field"><span>パスワード</span><input id="password" type="password" autocomplete="current-password"></label>
<button id="login" class="btn">ログイン</button><div id="login-status" class="status"></div>
</section>
<section id="cms" style="display:none">
<div class="tabs"><button class="btn active" data-tab="blog">BLOG</button><button class="btn secondary" data-tab="history">HISTORY</button></div>
<div id="blog" class="section active">
<div class="grid"><div>
<div class="panel"><h2 id="post-editor-title">新しい記事</h2><input id="post-id" type="hidden">
<label class="field"><span>タイトル</span><input id="post-title" type="text" maxlength="160"></label>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="field"><span>日付</span><input id="post-date" type="text" placeholder="2026.09.04"></label><label class="field"><span>タグ</span><input id="post-tag" type="text"></label></div>
<label class="field"><span>一覧用の短い説明（空欄なら本文から自動生成）</span><textarea id="post-excerpt"></textarea></label>
<label class="field"><span>アイキャッチ画像（任意）</span><input id="featured-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div id="featured-preview"></div></label>
<h3>本文ブロック</h3>
<div class="toolbar"><button id="add-paragraph" class="btn secondary" type="button">＋ 文章</button><button id="add-heading" class="btn secondary" type="button">＋ 見出し</button><button id="add-images" class="btn secondary" type="button">＋ 画像を追加</button><input id="image-files" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden></div>
<div id="blocks"></div>
<div class="toolbar"><button id="save-post" class="btn" type="button">記事を保存</button><button id="new-post" class="btn secondary" type="button">新規記事</button><button id="delete-post" class="btn danger" type="button" style="display:none">この記事を削除</button></div><div id="post-status" class="status"></div>
</div>
<div class="panel"><h2>記事一覧</h2><div id="post-list"></div></div>
</div><aside><div class="panel"><h2>プレビュー</h2><div id="preview" class="preview"></div></div><div class="panel"><p><strong>画像は何枚でも追加可能。</strong></p><p>「＋画像を追加」で複数選択すると、本文内に画像ブロックとして追加されます。上下移動で掲載位置を変えられます。</p></div></aside></div>
</div>
<div id="history" class="section"><div class="grid"><div class="panel"><h2>HISTORY編集</h2><input id="history-index" type="hidden"><label class="field"><span>Version</span><input id="history-version" type="text"></label><label class="field"><span>日付</span><input id="history-date" type="text"></label><label class="field"><span>内容</span><textarea id="history-text"></textarea></label><div class="toolbar"><button id="history-save" class="btn">保存</button><button id="history-new" class="btn secondary">新規</button></div><div id="history-status" class="status"></div></div><aside class="panel"><h2>一覧</h2><div id="history-list"></div></aside></div></div>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
<script src="admin.js"></script>
<script src="site-content.js"></script>
<script>
(function(){"use strict";
var $=function(id){return document.getElementById(id)}; if(location.protocol==="file:") $("file-warning").style.display="block";
var blogKey="blog_posts_v2", historyKey="history_entries_v1", posts=[], historyEntries=[], blocks=[], featuredUrl="", featuredObjectUrl="";
function status(el,msg,error){el.textContent=msg;el.className="status"+(error?" error":"");el.style.display="block"} function clearStatus(el){el.style.display="none"}
function id(prefix){return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7)}
function parse(raw,fallback){try{return raw?JSON.parse(raw):JSON.parse(JSON.stringify(fallback));}catch(e){return JSON.parse(JSON.stringify(fallback));}}
function saveSetting(key,value){var raw=JSON.stringify(value);return ADMIN.adminSetSiteSetting(key,raw).then(function(){return ADMIN.getSiteSetting(key)}).then(function(saved){if(saved!==raw)throw new Error("保存後のDB値が一致しません")});}
function escapeText(s){return String(s||"")}
function revokeFeatured(){if(featuredObjectUrl){URL.revokeObjectURL(featuredObjectUrl);featuredObjectUrl=""}}
function showFeatured(url){var el=$("featured-preview");el.innerHTML="";if(!url)return;var img=document.createElement("img");img.src=url;img.style.cssText="max-width:100%;max-height:260px;object-fit:contain;margin-top:8px";el.appendChild(img);var rm=document.createElement("button");rm.type="button";rm.className="btn secondary";rm.textContent="アイキャッチを外す";rm.onclick=function(){featuredUrl="";$("featured-file").value="";showFeatured("");renderPreview()};el.appendChild(rm)}
function addBlock(block){blocks.push(block||{type:"paragraph",text:""});renderBlocks();renderPreview()}
function moveBlock(i,d){var j=i+d;if(j<0||j>=blocks.length)return;var t=blocks[i];blocks[i]=blocks[j];blocks[j]=t;renderBlocks();renderPreview()}
function renderBlocks(){var root=$("blocks");root.innerHTML="";blocks.forEach(function(block,i){var box=document.createElement("div");box.className="block";var head=document.createElement("div");head.className="block-head";var label=document.createElement("strong");label.textContent=block.type==="image"?"画像":block.type==="heading"?"見出し":"文章";head.appendChild(label);var actions=document.createElement("div");actions.className="block-actions";[["↑",-1],["↓",1]].forEach(function(x){var b=document.createElement("button");b.type="button";b.className="btn secondary";b.textContent=x[0];b.onclick=function(){moveBlock(i,x[1])};actions.appendChild(b)});var del=document.createElement("button");del.type="button";del.className="btn secondary";del.textContent="削除";del.onclick=function(){blocks.splice(i,1);renderBlocks();renderPreview()};actions.appendChild(del);head.appendChild(actions);box.appendChild(head);
if(block.type==="image"){var img=document.createElement("img");img.src=block.url;img.alt=block.alt||"";box.appendChild(img);var alt=document.createElement("input");alt.type="text";alt.placeholder="代替テキスト";alt.value=block.alt||"";alt.oninput=function(){block.alt=alt.value;renderPreview()};box.appendChild(alt);var cap=document.createElement("input");cap.type="text";cap.placeholder="キャプション（任意）";cap.value=block.caption||"";cap.style.marginTop="6px";cap.oninput=function(){block.caption=cap.value;renderPreview()};box.appendChild(cap)}else{var ta=document.createElement("textarea");ta.value=block.text||"";ta.placeholder=block.type==="heading"?"見出し":"本文";ta.oninput=function(){block.text=ta.value;renderPreview()};box.appendChild(ta)}root.appendChild(box)});}
function renderPreview(){var p=$("preview");p.innerHTML="";var h=document.createElement("h2");h.textContent=$("post-title").value||"記事タイトル";p.appendChild(h);var meta=document.createElement("div");meta.className="meta";meta.textContent=[$("post-date").value,$("post-tag").value].filter(Boolean).join(" / ");p.appendChild(meta);if(featuredUrl){var fi=document.createElement("img");fi.src=featuredUrl;p.appendChild(fi)}blocks.forEach(function(b){if(b.type==="heading"){var hh=document.createElement("h3");hh.textContent=b.text;p.appendChild(hh)}else if(b.type==="image"){var f=document.createElement("figure"),im=document.createElement("img");im.src=b.url;im.alt=b.alt||"";f.appendChild(im);if(b.caption){var c=document.createElement("figcaption");c.textContent=b.caption;f.appendChild(c)}p.appendChild(f)}else{var pp=document.createElement("p");pp.textContent=b.text;pp.style.whiteSpace="pre-line";p.appendChild(pp)}})}
["post-title","post-date","post-tag"].forEach(function(k){$(k).addEventListener("input",renderPreview)});
$("add-paragraph").onclick=function(){addBlock({type:"paragraph",text:""})};$("add-heading").onclick=function(){addBlock({type:"heading",text:""})};$("add-images").onclick=function(){$("image-files").click()};
$("image-files").onchange=function(){var files=Array.prototype.slice.call(this.files||[]);if(!files.length)return;status($("post-status"),files.length+"枚アップロード中…",false);Promise.all(files.map(function(file){return ADMIN.uploadPackImage(file,"blog-content").then(function(url){return {type:"image",url:url,alt:"",caption:""}})})).then(function(newBlocks){blocks=blocks.concat(newBlocks);renderBlocks();renderPreview();status($("post-status"),newBlocks.length+"枚追加しました。記事保存で確定します。",false)}).catch(function(e){status($("post-status"),"画像アップロード失敗: "+(e.message||e),true)}).finally(function(){$("image-files").value=""})};
$("featured-file").onchange=function(){var file=this.files&&this.files[0];if(!file)return;revokeFeatured();featuredObjectUrl=URL.createObjectURL(file);showFeatured(featuredObjectUrl);status($("post-status"),"アイキャッチをアップロード中…",false);ADMIN.uploadPackImage(file,"blog-featured").then(function(url){revokeFeatured();featuredUrl=url;showFeatured(url);renderPreview();status($("post-status"),"アイキャッチをアップロードしました。",false)}).catch(function(e){status($("post-status"),"画像アップロード失敗: "+(e.message||e),true)})};
function resetPost(){ $("post-id").value="";$("post-title").value="";$("post-date").value=new Date().toISOString().slice(0,10).replace(/-/g,".");$("post-tag").value="";$("post-excerpt").value="";$("featured-file").value="";featuredUrl="";blocks=[{type:"paragraph",text:""}];$("post-editor-title").textContent="新しい記事";$("delete-post").style.display="none";showFeatured("");renderBlocks();renderPreview();clearStatus($("post-status"))}
function editPost(post){$("post-id").value=post.id;$("post-title").value=post.title||"";$("post-date").value=post.date||"";$("post-tag").value=post.tag||"";$("post-excerpt").value=post.excerpt||"";featuredUrl=post.featured_image_url||"";blocks=JSON.parse(JSON.stringify(post.blocks||[]));if(!blocks.length)blocks=[{type:"paragraph",text:""}];$("post-editor-title").textContent="記事を編集";$("delete-post").style.display="inline-block";showFeatured(featuredUrl);renderBlocks();renderPreview();window.scrollTo({top:0,behavior:"smooth"})}
function renderPostList(){var root=$("post-list");root.innerHTML="";posts.slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""))}).forEach(function(post){var row=document.createElement("div");row.className="post-row";var s=document.createElement("strong");s.textContent=post.title;row.appendChild(s);var m=document.createElement("div");m.className="meta";m.textContent=[post.date,post.tag].filter(Boolean).join(" / ");row.appendChild(m);var b=document.createElement("button");b.className="btn secondary";b.textContent="編集";b.onclick=function(){editPost(post)};row.appendChild(b);root.appendChild(row)})}
$("save-post").onclick=function(){var title=$("post-title").value.trim();if(!title){status($("post-status"),"タイトルを入力してください",true);return}var cleaned=blocks.filter(function(b){return b.type==="image"?!!b.url:!!String(b.text||"").trim()});if(!cleaned.length){status($("post-status"),"本文を1ブロック以上追加してください",true);return}var existingId=$("post-id").value;var post={id:existingId||id("post"),title:title,date:$("post-date").value.trim(),tag:$("post-tag").value.trim(),excerpt:$("post-excerpt").value.trim(),featured_image_url:featuredUrl||"",blocks:cleaned};var idx=posts.findIndex(function(x){return x.id===post.id});var next=posts.slice();if(idx>=0)next[idx]=post;else next.push(post);$("save-post").disabled=true;saveSetting(blogKey,next).then(function(){posts=next;renderPostList();editPost(post);status($("post-status"),"記事を保存しました。",false)}).catch(function(e){status($("post-status"),"保存失敗: "+(e.message||e)+"。SupabaseのCMS用SQLが未適用なら index_cms_site_settings.sql を実行してください。",true)}).finally(function(){$("save-post").disabled=false})};
$("delete-post").onclick=function(){var pid=$("post-id").value;if(!pid||!confirm("この記事を削除しますか？"))return;var next=posts.filter(function(x){return x.id!==pid});saveSetting(blogKey,next).then(function(){posts=next;renderPostList();resetPost();status($("post-status"),"削除しました。",false)}).catch(function(e){status($("post-status"),"削除失敗: "+(e.message||e),true)})};$("new-post").onclick=resetPost;
function renderHistory(){var root=$("history-list");root.innerHTML="";historyEntries.forEach(function(entry,index){var row=document.createElement("div");row.className="history-row";var s=document.createElement("strong");s.textContent=entry.text;row.appendChild(s);var m=document.createElement("div");m.className="meta";m.textContent=[entry.version,entry.date].filter(Boolean).join(" / ");row.appendChild(m);var e=document.createElement("button");e.className="btn secondary";e.textContent="編集";e.onclick=function(){$("history-index").value=String(index);$("history-version").value=entry.version||"";$("history-date").value=entry.date||"";$("history-text").value=entry.text||""};row.appendChild(e);var d=document.createElement("button");d.className="btn secondary";d.style.marginLeft="6px";d.textContent="削除";d.onclick=function(){if(!confirm("削除しますか？"))return;var next=historyEntries.slice();next.splice(index,1);saveSetting(historyKey,next).then(function(){historyEntries=next;renderHistory()}).catch(function(err){status($("history-status"),"削除失敗: "+(err.message||err),true)})};row.appendChild(d);root.appendChild(row)})}
function resetHistory(){$("history-index").value="";$("history-version").value="";$("history-date").value="";$("history-text").value="";clearStatus($("history-status"))}$("history-new").onclick=resetHistory;$("history-save").onclick=function(){var text=$("history-text").value.trim();if(!text){status($("history-status"),"内容を入力してください",true);return}var idx=$("history-index").value===""?-1:Number($("history-index").value),next=historyEntries.slice();var entry={id:idx>=0&&next[idx]?next[idx].id:id("history"),version:$("history-version").value.trim(),date:$("history-date").value.trim(),text:text};if(idx>=0&&next[idx])next[idx]=entry;else next.unshift(entry);saveSetting(historyKey,next).then(function(){historyEntries=next;renderHistory();resetHistory();status($("history-status"),"HISTORYを保存しました。",false)}).catch(function(e){status($("history-status"),"保存失敗: "+(e.message||e),true)})};
function loadContent(){return Promise.all([ADMIN.getSiteSetting(blogKey),ADMIN.getSiteSetting(historyKey)]).then(function(v){posts=parse(v[0],window.RYOTEI_CONTENT_STORE.DEFAULT_BLOG);historyEntries=parse(v[1],window.RYOTEI_CONTENT_STORE.DEFAULT_HISTORY);renderPostList();renderHistory();resetPost()})}
function showCms(){ $("login-box").style.display="none";$("cms").style.display="block";$("logout").style.display="inline-block";loadContent().catch(function(e){status($("post-status"),"読み込み失敗: "+(e.message||e),true)})}
$("login").onclick=function(){clearStatus($("login-status"));ADMIN.login($("email").value.trim(),$("password").value).then(function(){return ADMIN.checkAdminAccess()}).then(function(ok){if(!ok)throw new Error("管理者権限がありません");showCms()}).catch(function(e){status($("login-status"),e.message||String(e),true)})};$("logout").onclick=function(){ADMIN.logout().then(function(){location.reload()})};
document.querySelectorAll("[data-tab]").forEach(function(btn){btn.onclick=function(){document.querySelectorAll("[data-tab]").forEach(function(b){b.classList.remove("active");b.classList.add("secondary")});btn.classList.add("active");btn.classList.remove("secondary");document.querySelectorAll(".section").forEach(function(s){s.classList.remove("active")});$(btn.dataset.tab).classList.add("active")}});
ADMIN.getSession().then(function(session){if(!session)return;return ADMIN.checkAdminAccess().then(function(ok){if(ok)showCms()})});
})();
</script>
</body>
</html>
