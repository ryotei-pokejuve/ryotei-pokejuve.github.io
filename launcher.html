<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>LAUNCHER | RYOTEI</title>
  <meta name="description" content="りょていのサイト内の各ページへすばやく移動するためのランチャーです。">
  <link rel="icon" type="image/jpg" href="ryotei.jpg">
  <link rel="stylesheet" href="assets/css/2d-tokens.css">
  <script>(function(){try{var saved=localStorage.getItem('ryotei-2d-theme');if(saved==='light'||saved==='dark'){document.documentElement.dataset.theme=saved;return;}}catch(error){}var light=typeof matchMedia==='function'&&matchMedia('(prefers-color-scheme: light)').matches;document.documentElement.dataset.theme=light?'light':'dark';}());</script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "DotGothic16", "MS Gothic", "Osaka-Mono", ui-monospace, monospace;
    }
    .shell { max-width: 1040px; margin: 0 auto; padding: 24px 16px 40px; }
    .bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
      background: var(--bar-bg); color: var(--bar-ink);
      box-shadow: var(--ring), var(--lift);
      padding: 14px 18px; margin-bottom: 18px;
    }
    .bar h1 { margin: 0; font-size: 1.15rem; letter-spacing: .08em; }
    .bar .eyebrow { margin: 0; font-size: .7rem; color: var(--bar-dim); letter-spacing: .14em; }
    .bar .spacer { flex: 1; }
    .bar button {
      font: inherit; font-size: .8rem; cursor: pointer;
      background: transparent; color: var(--bar-ink);
      border: 1px solid var(--bar-dim); padding: 6px 10px;
    }
    .search {
      width: 100%; font: inherit; font-size: 1rem;
      padding: 12px 14px; margin-bottom: 20px;
      background: var(--card); color: var(--text);
      border: var(--bw) solid var(--edge); outline: none;
    }
    .search:focus { border-color: var(--accent); }
    .group { margin-bottom: 22px; }
    .group h2 {
      margin: 0 0 10px; font-size: .8rem; letter-spacing: .14em; color: var(--dim);
      border-bottom: 1px solid var(--line); padding-bottom: 6px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .tile {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 14px; text-decoration: none; color: var(--text);
      background: var(--card); box-shadow: var(--ring), var(--lift);
      border: var(--bw) solid transparent; outline: none;
    }
    .tile:hover, .tile:focus-visible, .tile.is-active {
      background: var(--sel-bg); color: var(--sel-ink); border-color: var(--accent);
    }
    .tile .icon { font-size: 1.6rem; line-height: 1; flex: none; }
    .tile .name { display: block; font-weight: bold; margin-bottom: 4px; }
    .tile .desc { display: block; font-size: .78rem; color: var(--dim); line-height: 1.5; }
    .tile .file { display: block; font-size: .7rem; color: var(--faint); margin-top: 6px; }
    .tile .key {
      margin-left: auto; flex: none; font-size: .7rem; color: var(--faint);
      border: 1px solid var(--edge); padding: 1px 5px;
    }
    .empty { color: var(--dim); text-align: center; padding: 32px 0; }
    .hint { margin-top: 24px; font-size: .75rem; color: var(--dim); text-align: center; }
    .hint kbd { border: 1px solid var(--edge); padding: 1px 5px; margin: 0 2px; font: inherit; }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } .tile .key { display: none; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="bar">
      <div>
        <p class="eyebrow">RYOTEI INFORMATION TERMINAL</p>
        <h1>LAUNCHER</h1>
      </div>
      <span class="spacer"></span>
      <button id="theme-toggle" type="button" aria-label="配色テーマを切り替える">THEME: <span>DARK</span></button>
    </header>

    <input id="launcher-search" class="search" type="search" placeholder="ページを検索（/ キー）" aria-label="ページを絞り込む" autocomplete="off">
    <div id="launcher-groups"></div>
    <p id="launcher-empty" class="empty" hidden>一致するページがありません。</p>
    <p class="hint"><kbd>/</kbd>検索 <kbd>矢印</kbd>選択 <kbd>ENTER</kbd>開く <kbd>1-9</kbd>ショートカット <kbd>ESC</kbd>クリア</p>
  </main>

  <script>
  (function(){
    "use strict";

    // ランチャーに並べるページ一覧。ページを追加したらここに1行足すだけでOK
    var GROUPS = [
      { title: "SITE", items: [
        { icon: "🏠", name: "トップ（2D MODE）", file: "index.html", desc: "メインの入口" },
        { icon: "👁", name: "Lainモード", file: "lain.html", desc: "黒背景＋シアンの端末風UI" },
        { icon: "📝", name: "BLOG", file: "blog.html", desc: "ブログ記事一覧" }
      ]},
      { title: "CARD MARKET", items: [
        { icon: "🎴", name: "カード図鑑", file: "search.html", desc: "カード名・番号・レアリティで検索" },
        { icon: "💴", name: "SHORTS PRICE", file: "price.html", desc: "ショート動画で載せたカードの価格" }
      ]},
      { title: "PREVIEW", items: [
        { icon: "🖥", name: "2D MODE Preview", file: "preview-2d.html", desc: "2D端末シェルの検証ページ" },
        { icon: "🧊", name: "3D MODE Preview", file: "preview-3d.html", desc: "Unity WebGLの3D hostページ" }
      ]},
      { title: "ADMIN", items: [
        { icon: "🛠", name: "カード管理", file: "admin.html", desc: "カード・価格の登録（ログイン必須）" },
        { icon: "🗂", name: "INDEX CMS", file: "index-admin.html", desc: "BLOG / HISTORY の管理（ログイン必須）" }
      ]},
      { title: "INFO", items: [
        { icon: "ℹ️", name: "このサイトについて", file: "about.html", desc: "運営者情報" },
        { icon: "✉️", name: "お問い合わせ", file: "contact.html", desc: "連絡先" },
        { icon: "🔒", name: "プライバシー", file: "privacy.html", desc: "プライバシーポリシー" },
        { icon: "📄", name: "免責事項", file: "terms.html", desc: "免責事項・利用規約" }
      ]}
    ];

    var groupsEl = document.getElementById("launcher-groups");
    var emptyEl = document.getElementById("launcher-empty");
    var searchEl = document.getElementById("launcher-search");
    var visible = [];
    var active = -1;

    function render(query){
      var q = (query || "").trim().toLowerCase();
      groupsEl.innerHTML = "";
      visible = [];
      GROUPS.forEach(function(group){
        var items = group.items.filter(function(item){
          return !q || (item.name + " " + item.file + " " + item.desc + " " + group.title).toLowerCase().indexOf(q) !== -1;
        });
        if(!items.length) return;
        var section = document.createElement("section");
        section.className = "group";
        var h2 = document.createElement("h2");
        h2.textContent = group.title;
        var grid = document.createElement("div");
        grid.className = "grid";
        items.forEach(function(item){
          var a = document.createElement("a");
          a.className = "tile";
          a.href = item.file;
          var index = visible.length;
          a.innerHTML = '<span class="icon" aria-hidden="true"></span><span><span class="name"></span><span class="desc"></span><span class="file"></span></span>';
          a.querySelector(".icon").textContent = item.icon;
          a.querySelector(".name").textContent = item.name;
          a.querySelector(".desc").textContent = item.desc;
          a.querySelector(".file").textContent = item.file;
          if(index < 9){
            var key = document.createElement("span");
            key.className = "key";
            key.setAttribute("aria-hidden", "true");
            key.textContent = String(index + 1);
            a.appendChild(key);
          }
          a.addEventListener("mouseenter", function(){ setActive(index, false); });
          grid.appendChild(a);
          visible.push(a);
        });
        section.appendChild(h2);
        section.appendChild(grid);
        groupsEl.appendChild(section);
      });
      emptyEl.hidden = visible.length > 0;
      setActive(q && visible.length ? 0 : -1, false);
    }

    function setActive(index, focus){
      visible.forEach(function(el, i){ el.classList.toggle("is-active", i === index); });
      active = index;
      if(focus && visible[index]) visible[index].focus();
    }

    // 矢印キーの移動量（上下はグリッドの列数ぶん）
    function columns(){
      if(!visible[active]) return 1;
      var top = visible[active].offsetTop;
      var grid = visible[active].parentNode;
      return Array.prototype.filter.call(grid.children, function(el){ return el.offsetTop === top; }).length || 1;
    }

    document.addEventListener("keydown", function(event){
      var inSearch = document.activeElement === searchEl;
      if(event.key === "/" && !inSearch){
        event.preventDefault();
        searchEl.focus();
        searchEl.select();
        return;
      }
      if(event.key === "Escape"){
        searchEl.value = "";
        render("");
        searchEl.blur();
        return;
      }
      if(!inSearch && /^[1-9]$/.test(event.key) && !event.ctrlKey && !event.metaKey && !event.altKey){
        var target = visible[Number(event.key) - 1];
        if(target) location.href = target.href;
        return;
      }
      if(!visible.length) return;
      var step = 0;
      if(event.key === "ArrowRight") step = 1;
      else if(event.key === "ArrowLeft") step = -1;
      else if(event.key === "ArrowDown") step = active < 0 ? 1 : columns();
      else if(event.key === "ArrowUp") step = -columns();
      else if(event.key === "Enter" && inSearch && visible[Math.max(active, 0)]){
        event.preventDefault();
        location.href = visible[Math.max(active, 0)].href;
        return;
      }
      if(!step || (inSearch && step === 1 && event.key === "ArrowRight") || (inSearch && event.key === "ArrowLeft")) return;
      event.preventDefault();
      var next = Math.min(visible.length - 1, Math.max(0, (active < 0 ? -1 : active) + step));
      setActive(next, true);
    });

    searchEl.addEventListener("input", function(){ render(searchEl.value); });

    var themeButton = document.getElementById("theme-toggle");
    function syncTheme(){
      themeButton.querySelector("span").textContent = document.documentElement.dataset.theme === "light" ? "LIGHT" : "DARK";
    }
    themeButton.addEventListener("click", function(){
      var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem("ryotei-2d-theme", next); } catch(error) {}
      syncTheme();
    });

    syncTheme();
    render("");
  }());
  </script>
</body>
</html>
