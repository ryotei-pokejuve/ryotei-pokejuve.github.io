<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BLOG｜りょていのサイト</title>
  <meta name="description" content="りょていのサイトの更新情報・お知らせ・ブログ記事一覧。">
  <link rel="icon" type="image/jpg" href="ryotei.jpg">
  <link rel="stylesheet" href="assets/css/2d-tokens.css">
  <link rel="stylesheet" href="assets/css/preview-2d.css">
  <style>
    body{min-height:100vh;padding:24px 14px;background:var(--deep);color:var(--ink)}
    .blog-shell{max-width:920px;margin:0 auto}.blog-head{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:14px}
    .blog-head h1{margin:0}.blog-nav{display:flex;gap:10px;flex-wrap:wrap}.blog-nav a{color:inherit}
    .blog-window{padding:20px}.blog-list article{padding:18px 0;border-bottom:1px solid var(--line)}.blog-list article:first-child{padding-top:0}
    .blog-list h2,.blog-article h2{margin:.25rem 0 .35rem}.blog-meta{margin-bottom:12px}.blog-body p{line-height:1.9;white-space:pre-line}.blog-body h3{margin:1.8em 0 .55em}.blog-content-image{margin:20px 0}.blog-content-image img{display:block;max-width:100%;height:auto;margin:0 auto;border:1px solid var(--line)}.blog-content-image figcaption{text-align:center;font-size:12px;opacity:.72;margin-top:6px}
    .blog-hero{display:block;width:100%;max-height:560px;object-fit:contain;margin:14px 0 20px;border:1px solid var(--line);background:rgba(0,0,0,.18)}.blog-list-image{display:block;width:100%;max-height:320px;object-fit:cover;margin:10px 0 12px;border:1px solid var(--line)}
    .blog-title-link{color:inherit;text-decoration:none}.blog-title-link:hover{text-decoration:underline}.back-link{display:inline-block;margin-top:18px}
    .loading{opacity:.72}.site-footer{margin-top:14px}
    @media(max-width:640px){body{padding:12px 8px}.blog-window{padding:14px}.blog-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="blog-shell">
    <header class="blog-head">
      <div><p class="eyebrow">RYOTEI INFORMATION TERMINAL</p><h1>BLOG</h1></div>
      <nav class="blog-nav"><a href="index.html#blog">2D MODEへ戻る</a><a href="index.html">TOP</a></nav>
    </header>
    <section class="win2 blog-window">
      <div id="blog-root" class="loading">BLOGを読み込んでいます……</div>
    </section>
    <footer class="site-footer"><a href="about.html">このサイトについて</a><a href="privacy.html">プライバシー</a><a href="terms.html">免責事項</a><a href="contact.html">お問い合わせ</a><span>©2026 りょてい</span></footer>
  </main>
  <script src="site-content.js"></script>
  <script>
  (function(){
    "use strict";
    var root=document.getElementById("blog-root");
    var store=window.RYOTEI_CONTENT_STORE;
    var postId=new URLSearchParams(location.search).get("post");
    function metaNode(post){
      var meta=document.createElement("div"); meta.className="blog-meta"; meta.appendChild(document.createTextNode(post.date||""));
      if(post.tag){ var tag=document.createElement("span"); tag.className="blog-tag"; tag.textContent=post.tag; meta.appendChild(document.createTextNode(" ")); meta.appendChild(tag); }
      return meta;
    }
    store.loadBlogPosts().then(function(posts){
      posts=store.sortBlog(posts); root.classList.remove("loading"); root.innerHTML="";
      if(postId){
        var post=posts.find(function(item){return item.id===postId;});
        if(!post){ var missing=document.createElement("p"); missing.textContent="記事が見つかりませんでした。"; root.appendChild(missing); }
        else {
          document.title=post.title+"｜BLOG｜りょていのサイト";
          var article=document.createElement("article"); article.className="blog-article";
          var h=document.createElement("h2"); h.textContent=post.title; article.appendChild(h); article.appendChild(metaNode(post));
          if(post.featured_image_url){ var image=document.createElement("img"); image.className="blog-hero"; image.src=post.featured_image_url; image.alt=post.title; article.appendChild(image); }
          var body=document.createElement("div"); body.className="blog-body"; store.renderPostBlocks(post,body); article.appendChild(body); root.appendChild(article);
        }
        var back=document.createElement("a"); back.className="back-link"; back.href="blog.html"; back.textContent="← 記事一覧へ"; root.appendChild(back); return;
      }
      var heading=document.createElement("p"); heading.className="flavor"; heading.textContent="レポート / 記事一覧"; root.appendChild(heading);
      var list=document.createElement("div"); list.className="blog-list";
      if(!posts.length){ var empty=document.createElement("p"); empty.textContent="記事はまだありません。"; list.appendChild(empty); }
      posts.forEach(function(post){
        var article=document.createElement("article"); var h=document.createElement("h2"); var a=document.createElement("a");
        a.className="blog-title-link"; a.href="blog.html?post="+encodeURIComponent(post.id); a.textContent=post.title; h.appendChild(a); article.appendChild(h); article.appendChild(metaNode(post));
        var imageUrl=store.firstImage(post); if(imageUrl){ var image=document.createElement("img"); image.className="blog-list-image"; image.src=imageUrl; image.alt=post.title; image.loading="lazy"; article.appendChild(image); }
        var excerpt=document.createElement("p"); excerpt.textContent=store.excerptFor(post,220); article.appendChild(excerpt); list.appendChild(article);
      });
      root.appendChild(list);
    });
  }());
  </script>
</body>
</html>
