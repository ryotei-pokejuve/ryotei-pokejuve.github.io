<!DOCTYPE html>
<html lang="ja" data-theme="gba">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>りょていの冒険の書 - PRESS START</title>
<meta name="description" content="りょていのホームページ。GBA風・RPG風タイトル画面から始まるレトロデザインサイト。">

<!--
  ============================================================
  カスタマイズガイド（自分で編集するとき用メモ）
  ------------------------------------------------------------
  1. プロフィール内容    → PAGES.profile のテンプレート文字列
  2. 更新履歴の追加       → PAGES.history 内の <li class="log-item"> を複製
  3. ブログ記事の追加     → PAGES.blog 内の <article> を複製
  4. SNSリンク            → <footer id="sns-links"> の href を変更
  5. お問い合わせ先       → CONTACT_EMAIL 定数を変更
  6. Googleアナリティクス → 下部 GA_MEASUREMENT_ID に測定IDを入れるだけでOK
  7. 配色（テーマ）       → :root と [data-theme="dark"] の CSS変数
  8. YouTube導線          → YOUTUBE_CHANNEL_URL / YOUTUBE_FEATURED_VIDEO_ID 定数
  9. 広告(AdSense)        → 下部 ADSENSE_CLIENT / ADSENSE_SLOTS に審査通過後のIDを入れるだけでOK
  10. 動画一覧/Shorts/ポケカ動画/おすすめ/実績の自動更新
      → YOUTUBE_API_KEY / YOUTUBE_CHANNEL_ID / YOUTUBE_PLAYLIST_* 定数
      → 設定方法はREADME.mdの「YouTube自動更新の設定」参照
  ============================================================
-->

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23202030'/%3E%3Crect x='2' y='6' width='12' height='6' fill='%236b6bd9'/%3E%3Crect x='3' y='4' width='4' height='2' fill='%236b6bd9'/%3E%3Crect x='9' y='4' width='4' height='2' fill='%236b6bd9'/%3E%3Crect x='4' y='8' width='2' height='2' fill='%23202030'/%3E%3Crect x='10' y='8' width='2' height='2' fill='%23ffcc00'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  /* =========================================================
     0. 変数 / テーマ
  ========================================================= */
  :root{
    --font-pixel-en: 'Press Start 2P', monospace;
    --font-pixel-jp: 'DotGothic16', sans-serif;

    --bg-outer-1: #7b7bd6;
    --bg-outer-2: #4a4a9c;
    --window-bg: #f8f3e2;
    --window-border-outer: #2a2a4a;
    --window-border-inner: #ffffff;
    --text-color: #24243c;
    --text-sub: #55557a;
    --accent: #3d7fd4;
    --accent-2: #e0663f;
    --menu-hover: #d8ecff;
    --shadow-color: rgba(0,0,0,.35);
    --scanline: rgba(0,0,0,.05);
  }

  [data-theme="dark"]{
    --bg-outer-1: #1c1c30;
    --bg-outer-2: #0a0a14;
    --window-bg: #171726;
    --window-border-outer: #05050a;
    --window-border-inner: #5a5a8a;
    --text-color: #e8e8f4;
    --text-sub: #9a9ac0;
    --accent: #7fb2ff;
    --accent-2: #ffb02e;
    --menu-hover: #2a2a44;
    --shadow-color: rgba(0,0,0,.6);
    --scanline: rgba(255,255,255,.03);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family: var(--font-pixel-jp);
    color: var(--text-color);
    background: linear-gradient(160deg, var(--bg-outer-1), var(--bg-outer-2));
    min-height: 100vh;
    overflow-x: hidden;
    image-rendering: pixelated;
    transition: background .4s ease;
  }
  /* 走査線っぽい質感（軽量: 疑似要素グラデーションのみ） */
  body::before{
    content:"";
    position: fixed; inset:0;
    background: repeating-linear-gradient(
      to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 3px
    );
    pointer-events:none;
    z-index: 999;
  }
  button{ font-family: inherit; cursor:pointer; }
  a{ color: var(--accent); }

  /* =========================================================
     1. ブート画面（PRESS START）
  ========================================================= */
  #boot-screen{
    position: fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 40px;
    background: var(--bg-outer-2) url('assets/boot-bg.jpg') center 32% / cover no-repeat;
    z-index: 500;
    cursor: pointer;
    user-select:none;
    overflow: hidden;
  }
  #boot-screen::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.05) 40%, rgba(0,0,0,.35));
    z-index: 0;
  }
  #boot-logo{
    position: relative;
    z-index: 1;
    font-family: var(--font-pixel-jp);
    font-size: clamp(26px, 7vw, 48px);
    color:#fff;
    text-shadow: 4px 4px 0 var(--window-border-outer);
    text-align:center;
    line-height:1.8;
    letter-spacing: 2px;
  }
  #boot-logo small{
    display:block;
    font-family: var(--font-pixel-jp);
    font-size: .4em;
    color:#ffe083;
    margin-top: 14px;
    letter-spacing: 1px;
  }
  #press-start{
    position: relative;
    z-index: 1;
    font-family: var(--font-pixel-en);
    font-size: clamp(14px, 3vw, 20px);
    color:#fff;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 0%,50%{opacity:1;} 51%,100%{opacity:0;} }

  #boot-loading{
    position: relative;
    z-index: 1;
    width: min(260px, 70vw);
    height: 14px;
    border: 3px solid #fff;
    display:none;
    box-shadow: 0 0 0 3px var(--window-border-outer);
  }
  #boot-loading > i{
    display:block; height:100%; width:0%;
    background: repeating-linear-gradient(90deg, #ffe083 0 6px, #ffcf3d 6px 12px);
    animation: loadbar .7s steps(20) forwards;
  }
  @keyframes loadbar{ from{ width:0%; } to{ width:100%; } }

  #copyright-line{
    position:absolute; bottom: 18px;
    z-index: 1;
    font-family: var(--font-pixel-jp);
    font-size: 11px;
    color:#cfcff0;
  }

  /* =========================================================
     2. ゲーム本体コンテナ
  ========================================================= */
  #game-container{
    display:none;
    min-height:100vh;
    flex-direction:column;
    max-width: 980px;
    margin: 0 auto;
    padding: 14px;
  }
  #game-container.active{ display:flex; }

  /* ---- 上部ステータスバー ---- */
  #status-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 8px 14px;
    margin-bottom: 12px;
  }
  #status-bar .brand{
    font-family: var(--font-pixel-en);
    font-size: 11px;
    color:#fff;
    text-shadow: 2px 2px 0 var(--window-border-outer);
    letter-spacing:1px;
  }
  #status-controls{ display:flex; gap:8px; align-items:center; }
  .icon-btn{
    background: var(--window-bg);
    border: 3px solid var(--window-border-outer);
    box-shadow: inset 0 0 0 2px var(--window-border-inner);
    width: 34px; height: 34px;
    display:flex; align-items:center; justify-content:center;
    font-size: 15px;
    color: var(--text-color);
    clip-path: polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  }
  .icon-btn:active{ transform: translateY(1px); }

  /* =========================================================
     3. ピクセル風ウインドウ（GBA風テキストボックス）
  ========================================================= */
  .pixel-window{
    background: var(--window-bg);
    border: 4px solid var(--window-border-outer);
    box-shadow:
      inset 0 0 0 3px var(--window-border-inner),
      6px 6px 0 var(--shadow-color);
    clip-path: polygon(
      0 8px, 8px 8px, 8px 0,
      calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
      100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
      8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
    );
    padding: 18px 20px;
  }

  /* =========================================================
     4. メインレイアウト（メニュー + コンテンツ）
  ========================================================= */
  #main-layout{
    display:flex;
    gap: 14px;
    flex: 1;
    align-items: flex-start;
  }
  #menu-window{
    width: 210px;
    flex-shrink:0;
  }
  #menu-window h2{
    margin:0 0 10px;
    font-family: var(--font-pixel-en);
    font-size: 11px;
    color: var(--accent-2);
  }
  #menu-list{ list-style:none; margin:0; padding:0; }
  #menu-list li{
    padding: 9px 6px 9px 22px;
    position:relative;
    font-size: 15px;
    color: var(--text-color);
    cursor:pointer;
    border-radius:2px;
    margin-bottom: 2px;
  }
  #menu-list li::before{
    content:"";
    position:absolute; left:4px; top:50%;
    transform: translateY(-50%);
    width:0; height:0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 8px solid var(--accent);
    opacity:0;
    transition: opacity .1s;
  }
  #menu-list li.active{
    background: var(--menu-hover);
    font-weight:bold;
  }
  #menu-list li.active::before{
    opacity:1;
    animation: cursorMove .6s steps(2) infinite;
  }
  @keyframes cursorMove{ 0%,100%{ left:4px; } 50%{ left:1px; } }
  #menu-list li:hover{ background: var(--menu-hover); }

  #menu-footer{
    margin-top: 16px;
    padding-top: 12px;
    border-top: 2px dashed var(--text-sub);
    font-size: 11px;
    color: var(--text-sub);
    line-height:1.6;
  }

  /* ---- コンテンツウインドウ ---- */
  #content-window{
    flex:1;
    min-height: 420px;
    position:relative;
    overflow:hidden;
  }
  #page-content{
    animation: pageIn .35s ease;
  }
  #page-content.leaving{ animation: pageOut .2s ease forwards; }
  @keyframes pageIn{
    from{ opacity:0; transform: translateX(14px); clip-path: inset(0 0 0 100%); }
    to{ opacity:1; transform: translateX(0); clip-path: inset(0 0 0 0%); }
  }
  @keyframes pageOut{
    from{ opacity:1; transform: translateX(0); }
    to{ opacity:0; transform: translateX(-14px); }
  }

  .page-title{
    font-family: var(--font-pixel-en);
    font-size: 15px;
    color: var(--accent);
    margin: 0 0 16px;
    padding-bottom: 10px;
    border-bottom: 3px solid var(--accent);
    display:inline-block;
  }
  .page-content p{ line-height:1.9; font-size:15px; }
  .flavor{
    color: var(--text-sub);
    font-size: 13px;
    font-style: normal;
    border-left: 4px solid var(--accent-2);
    padding-left: 10px;
    margin: 14px 0;
  }

  /* ---- ステータス風テーブル（プロフィール等） ---- */
  .stat-table{ width:100%; border-collapse:collapse; margin: 14px 0; font-size:14px; }
  .stat-table tr{ border-bottom: 2px dotted var(--text-sub); }
  .stat-table td{ padding: 9px 6px; vertical-align:top; }
  .stat-table td:first-child{
    width: 32%; color: var(--accent-2); font-weight:bold; white-space:nowrap;
  }

  /* ---- 更新履歴 ---- */
  .log-list{ list-style:none; margin:0; padding:0; }
  .log-item{
    display:grid; grid-template-columns: 90px 60px 1fr;
    gap: 10px; padding: 10px 0; border-bottom: 2px dotted var(--text-sub);
    font-size: 14px; align-items:baseline;
  }
  .log-ver{ color:#fff; background: var(--accent); padding:2px 6px; font-size:11px; text-align:center; }
  .log-date{ color: var(--text-sub); font-size:12px; }

  /* ---- ブログ ---- */
  .blog-post{ padding: 14px 0; border-bottom: 2px dotted var(--text-sub); }
  .blog-post:last-child{ border-bottom:none; }
  .blog-post h3{ margin: 0 0 6px; font-size:16px; color: var(--text-color); }
  .blog-meta{ font-size:11px; color: var(--text-sub); margin-bottom:8px; }
  .blog-tag{
    display:inline-block; background: var(--menu-hover); color:var(--accent);
    font-size:10px; padding:2px 6px; margin-right:6px;
  }

  /* ---- 動画一覧(YouTube自動更新) ---- */
  .video-list{ list-style:none; margin:0; padding:0; }
  .video-item{ border-bottom: 2px dotted var(--text-sub); }
  .video-item:last-child{ border-bottom:none; }
  .video-item a{
    display:flex; align-items:center; gap:10px;
    padding: 10px 4px; text-decoration:none; color: var(--text-color);
  }
  .video-item a:hover{ background: var(--menu-hover); }
  .video-thumb{
    width: 96px; height: 54px; object-fit:cover; flex-shrink:0;
    border: 2px solid var(--window-border-outer);
  }
  .video-info{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .video-title{
    font-size: 13px; line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .video-date{ font-size: 11px; color: var(--text-sub); }
  .video-new{
    display:inline-block; align-self:flex-start;
    background: var(--accent-2); color:#fff;
    font-size: 10px; padding: 1px 6px; margin-bottom:2px;
  }
  .yt-async{ color: var(--text-sub); font-size: 13px; padding: 8px 0; }

  /* ---- お問い合わせ ---- */
  .contact-btn{
    display:inline-block;
    margin-top: 10px;
    padding: 10px 18px;
    background: var(--accent);
    color:#fff;
    text-decoration:none;
    font-size: 13px;
    border: 3px solid var(--window-border-outer);
    box-shadow: 3px 3px 0 var(--shadow-color);
  }
  .contact-btn:active{ transform: translate(2px,2px); box-shadow:none; }

  /* ---- YouTube導線 ---- */
  .yt-btn{ background:#ff3b3b; margin-right:10px; }
  .yt-embed-wrap{
    position:relative; width:100%; padding-top:56.25%;
    margin: 14px 0; border: 3px solid var(--window-border-outer);
  }
  .yt-embed-wrap iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
  }

  /* ---- 広告スロット ---- */
  .ad-slot{
    display:none;
    margin: 16px 0 0;
    padding: 8px;
    border: 3px dashed var(--text-sub);
    text-align:center;
    overflow:hidden;
  }

  #sns-links{
    display:flex; gap:10px; flex-wrap:wrap; margin-top: 18px;
  }
  .sns-btn{
    display:flex; align-items:center; gap:6px;
    padding: 8px 12px;
    background: var(--window-bg);
    border: 3px solid var(--window-border-outer);
    box-shadow: inset 0 0 0 2px var(--window-border-inner);
    text-decoration:none;
    color: var(--text-color);
    font-size: 12px;
  }
  .sns-btn:hover{ background: var(--menu-hover); }
  .sns-icon{ width:16px; height:16px; }

  /* =========================================================
     5. フッター
  ========================================================= */
  #site-footer{
    text-align:center;
    font-size: 11px;
    color:#e4e4ff;
    padding: 16px 0 6px;
  }

  /* =========================================================
     6. モバイル用ハンバーガー & レスポンシブ
  ========================================================= */
  #menu-toggle{ display:none; }

  @media (max-width: 720px){
    #main-layout{ flex-direction:column; }
    #menu-window{
      width:100%;
    }
    #menu-list{
      display:flex; overflow-x:auto; gap:6px; padding-bottom:4px;
    }
    #menu-list li{
      padding: 8px 12px; white-space:nowrap; font-size:13px;
    }
    #menu-list li::before{ display:none; }
    #menu-footer{ display:none; }
    .pixel-window{ padding: 14px; }
    #boot-logo{ padding: 0 10px; }
    .log-item{ grid-template-columns: 70px 50px 1fr; font-size:12.5px; }
  }
</style>
</head>
<body>

<!-- ============================================================
     ブート画面（PRESS START）
============================================================ -->
<div id="boot-screen" role="button" tabindex="0" aria-label="PUSH START でサイトへ進む">
  <div id="boot-logo">
    ポケカ引退品
    <small>りょてい</small>
  </div>
  <div id="press-start">PUSH START BUTTON</div>
  <div id="boot-loading"><i></i></div>
  <div id="copyright-line">©2026 りょてい inc</div>
</div>

<!-- ============================================================
     ゲーム本体
============================================================ -->
<div id="game-container">

  <div id="status-bar">
    <div class="brand">RYOTEI ADVENTURE</div>
    <div id="status-controls">
      <button class="icon-btn" id="sound-toggle" title="サウンド切替" aria-label="サウンド切替">🔊</button>
      <button class="icon-btn" id="theme-toggle" title="ダークモード切替" aria-label="ダークモード切替">🌙</button>
    </div>
  </div>

  <div id="main-layout">
    <nav id="menu-window" class="pixel-window" aria-label="メインメニュー">
      <h2>MENU</h2>
      <ul id="menu-list">
        <li data-page="top">🏠 トップ</li>
        <li data-page="videos">📹 動画一覧</li>
        <li data-page="shorts">💡 Shorts</li>
        <li data-page="pokeca">🎴 ポケカ動画</li>
        <li data-page="live">🖥️ おすすめ</li>
        <li data-page="achievements">🏆 実績</li>
        <li data-page="profile">👤 プロフィール</li>
        <li data-page="history">📜 更新履歴</li>
        <li data-page="blog">✏️ ブログ</li>
        <li data-page="contact">✉️ お問い合わせ</li>
      </ul>
      <div id="menu-footer">
        ↑↓：選択<br>

    <section id="content-window" class="pixel-window">
      <div id="page-content"></div>

  <div id="ad-slot-footer" class="ad-slot"></div>

  <footer id="site-footer">
    ©2026 りょてい inc
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     設定（ここを編集してカスタマイズ）
  ========================================================= */

  // YouTubeチャンネルのURLに変更してください
  var YOUTUBE_CHANNEL_URL = "https://www.youtube.com/@ryotei_pokemoncard";
  // 特集したい動画のID（例: youtube.com/watch?v=xxxxxxxxxxx の xxxxxxxxxxx 部分）。空なら埋め込み非表示
  var YOUTUBE_FEATURED_VIDEO_ID = "u46BlBEv6lk";

  /* ---- YouTube自動更新（動画一覧/Shorts/ポケカ動画/おすすめ/実績で使用） ----
     設定方法はREADME.md参照。すべて空のままなら「未設定です」と表示されるだけで、
     エラーにはならない。 */
  var YOUTUBE_API_KEY = "AIzaSyBW4fDC9AU3Xjdp2b5_j9L5GaR9zFtSipY";           // Google CloudでYouTube Data API v3のAPIキーを取得
  var YOUTUBE_CHANNEL_ID = "UCv8-wt6gkGbKf0DditFsL_g";        // UCから始まるチャンネルID（@ハンドルではない）
  var YOUTUBE_PLAYLIST_SHORTS = "PLBYd2EyPW3CDVw_g9CwdI2_X34kd78xPK";   // Shorts用の再生リストID
  var YOUTUBE_PLAYLIST_POKECA = "PLBYd2EyPW3CD1YvXDAajn1vfmfQFOWSEj";   // ポケカ動画用の再生リストID
  var YOUTUBE_PLAYLIST_LIVE = "PLBYd2EyPW3CD1YvXDAajn1vfmfQFOWSEj";// ライブ配信動画用の再生リストID

  var SNS_LINKS = [
    { label: "X (Twitter)", href: "https://x.com/", icon: "✕" },
    { label: "Instagram",   href: "https://instagram.com/", icon: "📷" },
    { label: "YouTube",     href: YOUTUBE_CHANNEL_URL, icon: "▶" },
    { label: "GitHub",      href: "https://github.com/", icon: "🐙" }
  ];

  /* =========================================================
     YouTube自動更新まわりのヘルパー
  ========================================================= */
  var ytChannelInfoPromise = null;

  function ytChannelInfo(){
    if(!YOUTUBE_API_KEY || !YOUTUBE_CHANNEL_ID) return Promise.resolve(null);
    if(!ytChannelInfoPromise){
      var url = "https://www.googleapis.com/youtube/v3/channels?part=contentDetails,statistics&id=" +
        encodeURIComponent(YOUTUBE_CHANNEL_ID) + "&key=" + encodeURIComponent(YOUTUBE_API_KEY);
      ytChannelInfoPromise = fetch(url).then(function(r){ return r.json(); }).then(function(data){
        var item = data && data.items && data.items[0];
        if(!item) return null;
        return {
          uploadsPlaylistId: item.contentDetails.relatedPlaylists.uploads,
          subscriberCount: item.statistics.subscriberCount,
          videoCount: item.statistics.videoCount,
          viewCount: item.statistics.viewCount
        };
      }).catch(function(){ return null; });
    }
    return ytChannelInfoPromise;
  }

  function ytPlaylistVideos(playlistId, maxResults){
    if(!YOUTUBE_API_KEY || !playlistId) return Promise.resolve([]);
    var url = "https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=" +
      encodeURIComponent(playlistId) + "&maxResults=" + (maxResults || 12) +
      "&key=" + encodeURIComponent(YOUTUBE_API_KEY);
    return fetch(url).then(function(r){ return r.json(); }).then(function(data){
      return (data.items || []).map(function(it){
        var sn = it.snippet || {};
        var thumb = sn.thumbnails && (sn.thumbnails.medium || sn.thumbnails.default);
        return {
          videoId: sn.resourceId && sn.resourceId.videoId,
          title: sn.title,
          publishedAt: sn.publishedAt,
          thumbnail: thumb && thumb.url
        };
      }).filter(function(v){ return v.videoId; });
    }).catch(function(){ return []; });
  }

  function ytIsNew(dateStr){
    var d = new Date(dateStr).getTime();
    return !isNaN(d) && (Date.now() - d) < 1000 * 60 * 60 * 24 * 7; // 7日以内
  }

  function ytVideoListHTML(videos){
    if(!YOUTUBE_API_KEY){
      return '<p class="flavor">YouTube APIが未設定です。設定すると動画一覧が自動で表示されます（README.md参照）。</p>';
    }
    if(!videos.length){
      return '<p class="flavor">動画がまだ見つかりませんでした。再生リストIDを確認してください。</p>';
    }
    return '<ul class="video-list">' + videos.map(function(v){
      return (
        '<li class="video-item">' +
          '<a href="https://www.youtube.com/watch?v=' + v.videoId + '" target="_blank" rel="noopener noreferrer">' +
            (v.thumbnail ? '<img class="video-thumb" src="' + v.thumbnail + '" alt="" loading="lazy">' : '') +
            '<span class="video-info">' +
              (ytIsNew(v.publishedAt) ? '<span class="video-new">NEW</span>' : '') +
              '<span class="video-title">' + v.title + '</span>' +
              '<span class="video-date">' + new Date(v.publishedAt).toLocaleDateString('ja-JP') + '</span>' +
            '</span>' +
          '</a>' +
        '</li>'
      );
    }).join('') + '</ul>';
  }

  function ytMountVideoPage(getPlaylistId){
    var container = document.querySelector('#page-content .yt-async');
    if(!container) return;
    Promise.resolve(getPlaylistId()).then(function(playlistId){
      if(!playlistId){
        container.innerHTML = YOUTUBE_API_KEY
          ? '<p class="flavor">再生リストIDが未設定です。</p>'
          : '<p class="flavor">YouTube APIが未設定です。設定すると自動で表示されます（README.md参照）。</p>';
        return;
      }
      return ytPlaylistVideos(playlistId).then(function(videos){
        container.innerHTML = ytVideoListHTML(videos);
      });
    });
  }

  /* =========================================================

  var PAGE_ORDER = ["top","videos","shorts","pokeca","live","achievements","profile","history","blog","contact"];

  /* =========================================================
     効果音（WebAudio, 外部ファイル不要で軽量）
  ========================================================= */
  var soundOn = true;
  var audioCtx = null;
  function beep(freq, dur){
    if(!soundOn) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      gain.gain.value = 0.05;
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.08));
      osc.stop(audioCtx.currentTime + (dur || 0.08));
    }catch(e){ /* 対応していない環境は無視 */ }
  }

  /* =========================================================
     ブート画面 → メイン画面
  ========================================================= */
  var bootScreen = document.getElementById("boot-screen");
  var bootLoading = document.getElementById("boot-loading");
  var gameContainer = document.getElementById("game-container");
  var started = false;

  function startGame(){
    if(started) return;
    started = true;
    beep(880, 0.1);
    bootLoading.style.display = "block";
    setTimeout(function(){
      bootScreen.style.display = "none";
      gameContainer.classList.add("active");
      var initial = (location.hash || "#top").replace("#","");
      renderPage(PAGES[initial] ? initial : "top", true);
    }, 750);
  }

  bootScreen.addEventListener("click", startGame);
  bootScreen.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " ") startGame();
  });
  window.addEventListener("keydown", function(e){
    if(!started && (e.key === "Enter" || e.key === " ")) startGame();
  });

  /* =========================================================
     メニュー操作 & ページ切り替え
  ========================================================= */
  var menuItems = Array.prototype.slice.call(document.querySelectorAll("#menu-list li"));
  var pageContentEl = document.getElementById("page-content");
  var currentIndex = 0;

  function renderPage(key, skipAnim){
    var page = PAGES[key];
    if(!page) return;
    currentIndex = PAGE_ORDER.indexOf(key);

    menuItems.forEach(function(li){
      li.classList.toggle("active", li.dataset.page === key);
    });

    function paint(){
      pageContentEl.innerHTML =
        '<h2 class="page-title">' + page.title + '</h2>' +
        '<div class="page-content">' + page.html() + '</div>';
      pageContentEl.classList.remove("leaving");
      if(typeof page.onMount === "function"){ page.onMount(); }
    }

    if(skipAnim){
      paint();
    } else {
      pageContentEl.classList.add("leaving");
      setTimeout(paint, 180);
    }

    if(location.hash !== "#" + key){
      history.pushState(null, "", "#" + key);
    }
  }

  menuItems.forEach(function(li){
    li.addEventListener("click", function(){
      beep(660, 0.07);
      renderPage(li.dataset.page);
    });
  });

  window.addEventListener("keydown", function(e){
    if(!started) return;
    if(e.key === "ArrowDown"){
      currentIndex = (currentIndex + 1) % PAGE_ORDER.length;
      beep(440, 0.05);
      renderPage(PAGE_ORDER[currentIndex]);
    } else if(e.key === "ArrowUp"){
      currentIndex = (currentIndex - 1 + PAGE_ORDER.length) % PAGE_ORDER.length;
      beep(440, 0.05);
      renderPage(PAGE_ORDER[currentIndex]);
    }
  });

  window.addEventListener("popstate", function(){
    var key = (location.hash || "#top").replace("#","");
    if(PAGES[key]) renderPage(key, true);
  });

  /* =========================================================
     サウンド / ダークモード トグル
  ========================================================= */
  var soundToggle = document.getElementById("sound-toggle");
  soundToggle.addEventListener("click", function(){
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? "🔊" : "🔈";
    if(soundOn) beep(880, 0.06);
  });

  var themeToggle = document.getElementById("theme-toggle");
  var root = document.documentElement;
  function applyTheme(theme){
    root.setAttribute("data-theme", theme);
    themeToggle.textContent = theme === "dark" ? "☀" : "🌙";
    localStorage.setItem("ryotei-theme", theme);
  }
  var savedTheme = localStorage.getItem("ryotei-theme") ||
    (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "gba");
  applyTheme(savedTheme);
  themeToggle.addEventListener("click", function(){
    beep(550, 0.06);
    applyTheme(root.getAttribute("data-theme") === "dark" ? "gba" : "dark");
  });

})();
</script>

<!-- ============================================================
     Google Analytics（あとから設定するだけで有効化できます）
     1. Googleアナリティクスで測定ID（G-XXXXXXXXXX）を取得
     2. 下の GA_MEASUREMENT_ID に貼り付けるだけでOK
============================================================ -->
<script>
(function(){
  var GA_MEASUREMENT_ID = ""; // 例: "G-XXXXXXXXXX"
  if(!GA_MEASUREMENT_ID) return;
  var s = document.createElement("script");
  s.async = true;
  s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_MEASUREMENT_ID;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag("js", new Date());
  gtag("config", GA_MEASUREMENT_ID);
})();
</script>

<!-- ============================================================
     Google AdSense（審査に通ったら設定するだけで有効化できます）
     1. AdSenseで広告ユニットを作成し、クライアントID(ca-pub-...)とスロットIDを取得
     2. 下の ADSENSE_CLIENT と ADSENSE_SLOTS に貼り付けるだけでOK
     3. 広告は本文下（ad-slot-content）とページ下部（ad-slot-footer）の2箇所に表示されます
============================================================ -->
<script>
(function(){
  var ADSENSE_CLIENT = ""; // 例: "ca-pub-1234567890123456"
  var ADSENSE_SLOTS = {
    content: "", // 本文下の広告スロットID
    footer: ""   // ページ下部の広告スロットID
  };
  if(!ADSENSE_CLIENT) return;

  var s = document.createElement("script");
  s.async = true;
  s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + ADSENSE_CLIENT;
  s.crossOrigin = "anonymous";
  document.head.appendChild(s);

  Object.keys(ADSENSE_SLOTS).forEach(function(key){
    var slot = ADSENSE_SLOTS[key];
    var el = document.getElementById("ad-slot-" + key);
    if(!slot || !el) return;
    el.style.display = "block";
    el.innerHTML = '<ins class="adsbygoogle" style="display:block" data-ad-client="' + ADSENSE_CLIENT + '" data-ad-slot="' + slot + '" data-ad-format="auto" data-full-width-responsive="true"></ins>';
    (window.adsbygoogle = window.adsbygoogle || []).push({});
  });
})();
</script>
