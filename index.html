    #warp-entry-overlay { position: fixed; inset: 0; z-index: 2000; pointer-events: none; background: var(--deep); opacity: 0; }
    #warp-entry-overlay.is-active { animation: warp-entry-in .6s cubic-bezier(.7, 0, .3, 1) both; }
    @keyframes warp-entry-in {
      from { clip-path: circle(150% at 50% 50%); opacity: 1; }
      to { clip-path: circle(0 at 50% 50%); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { #warp-entry-overlay.is-active { animation: none; } }

  <script>(function(){try{var saved=localStorage.getItem('ryotei-2d-theme');if(saved==='light'||saved==='dark'){document.documentElement.dataset.theme=saved;return;}var legacy=localStorage.getItem('ryotei-theme');if(legacy==='dark'||legacy==='gba'){document.documentElement.dataset.theme=legacy==='gba'?'light':'dark';return;}}catch(error){}var light=typeof matchMedia==='function'&&matchMedia('(prefers-color-scheme: light)').matches;document.documentElement.dataset.theme=light?'light':'dark';}());</script>
