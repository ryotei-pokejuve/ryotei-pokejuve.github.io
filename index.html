<script>
(function(){
  "use strict";

  function makeLink(href, text){
    var a = document.createElement("a");
    a.className = "open-link";
    a.href = href;
    a.textContent = text;
    return a;
  }

  function renderCustomPanels(){
    renderCardMarketLinks();
  }

  function renderCardMarketLinks(){
    var title = document.getElementById("detail-title");
    var content = document.getElementById("detail-content");
    var message = document.getElementById("message-text");
    if(!title || !content || title.textContent.trim() !== "CARD MARKET") return;
    if(content.dataset.cardMarketLinks === "1" && content.querySelector('[data-card-market-panel="1"]')) return;

    content.dataset.cardMarketLinks = "1";
    content.innerHTML = "";

    var box = document.createElement("div");
    box.className = "external-card";
    box.setAttribute("data-card-market-panel", "1");

    var cardText = document.createElement("p");
    cardText.textContent = "ポケモンカードを一覧で見れます。";
    box.appendChild(cardText);
    box.appendChild(makeLink("search.html", "カード一覧を見る"));

    var shortsText = document.createElement("p");
    shortsText.style.marginTop = "18px";
    shortsText.textContent = "ショート動画で載せたカードの価格を載せています。";
    box.appendChild(shortsText);
    box.appendChild(makeLink("price.html", "ショート価格を見る"));

    content.appendChild(box);

    if(message){
      message.textContent = "CARD MARKET：ポケモンカードを一覧で見れます。ショート動画で載せたカードの価格を載せています。";
    }
  }

  var title = document.getElementById("detail-title");
  var content = document.getElementById("detail-content");
  if(!title || !content) return;

  var observer = new MutationObserver(function(){
    setTimeout(renderCustomPanels, 0);
  });
  observer.observe(title, {childList:true, characterData:true, subtree:true});
  observer.observe(content, {childList:true, subtree:true});

  document.addEventListener("focusin", function(){
    setTimeout(renderCustomPanels, 0);
  });
  document.addEventListener("click", function(){
    setTimeout(renderCustomPanels, 0);
  });

  setTimeout(renderCustomPanels, 0);
}());
</script>


<script>
(function(){
  var mode3d = document.getElementById("lain-toggle");
  if(!mode3d) return;
  mode3d.removeAttribute("href");
  mode3d.setAttribute("aria-disabled","true");
  mode3d.setAttribute("tabindex","-1");
  mode3d.addEventListener("click", function(e){ e.preventDefault(); e.stopImmediatePropagation(); }, true);
}());
</script>
