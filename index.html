<!--
  ============================================================
  カスタマイズガイド（自分で編集するとき用メモ）
  ------------------------------------------------------------
  ★ページ内容・YouTube設定は全部 content.js に移動しました★
  　（index.html と lain.html の両方で共通の中身を使うため）

  1. プロフィール内容    → content.js の PAGES.profile
  2. 更新履歴の追加       → content.js の PAGES.history 内の <li class="log-item"> を複製
  3. ブログ記事の追加     → content.js の PAGES.blog 内の <article> を複製
  4. SNSリンク            → content.js の SNS_LINKS 配列
  5. SNSページ            → content.js の PAGES.sns（メールは非表示）
  6. Googleアナリティクス → このファイル下部 GA_MEASUREMENT_ID に測定IDを入れるだけでOK
  7. 配色（テーマ）       → :root と [data-theme="dark"] の CSS変数
  8. YouTube導線          → content.js の YOUTUBE_CHANNEL_URL / YOUTUBE_FEATURED_VIDEO_ID
  9. 広告(AdSense)        → このファイル下部 ADSENSE_CLIENT / ADSENSE_SLOTS に審査通過後のIDを入れるだけでOK
  10. 動画一覧/Shorts/ポケカ動画/ライブ配信/実績の自動更新
      → content.js の YOUTUBE_API_KEY / YOUTUBE_CHANNEL_ID / YOUTUBE_PLAYLIST_* 定数
      → 設定方法はREADME.mdの「YouTube自動更新の設定」参照
  11. Lainモード          → 右上の目アイコンでワープ演出とともに lain.html へ移動する
      （見た目だけ別UI。中身は content.js を共通利用しているので中身の編集は1箇所でOK）
  ============================================================
-->

<style>
  /* =========================================================
     0. 変数 / テーマ
  ========================================================= */
  :root{
    --font-pixel-en: 'Press Start 2P', monospace;
    --font-pixel-jp: 'DotGothic16', sans-serif;

    --bg-outer-1: #7b7bd6;
    --bg-outer-2: #4a4a9c;
    --window-bg: #f8f3e2;
    --window-border-outer: #2a2a4a;
    --window-border-inner: #ffffff;
    --text-color: #24243c;
    --text-sub: #55557a;
    --accent: #3d7fd4;
    --accent-2: #e0663f;
    --menu-hover: #d8ecff;
    --shadow-color: rgba(0,0,0,.35);
    --scanline: rgba(0,0,0,.05);
  }

  [data-theme="dark"]{
    --bg-outer-1: #1c1c30;
    --bg-outer-2: #0a0a14;
    --window-bg: #171726;
    --window-border-outer: #05050a;
    --window-border-inner: #5a5a8a;
    --text-color: #e8e8f4;
    --text-sub: #9a9ac0;
    --accent: #7fb2ff;
    --accent-2: #ffb02e;
    --menu-hover: #2a2a44;
    --shadow-color: rgba(0,0,0,.6);
    --scanline: rgba(255,255,255,.03);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family: var(--font-pixel-jp);
    color: var(--text-color);
    background: linear-gradient(160deg, var(--bg-outer-1), var(--bg-outer-2));
    min-height: 100vh;
    overflow-x: hidden;
    image-rendering: pixelated;
    transition: background .4s ease;
  }
  /* 走査線っぽい質感（軽量: 疑似要素グラデーションのみ） */
  body::before{
    content:"";
    position: fixed; inset:0;
    background: repeating-linear-gradient(
      to bottom, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 3px
    );
    pointer-events:none;
    z-index: 999;
  }
  button{ font-family: inherit; cursor:pointer; }
  a{ color: var(--accent); }

  /* =========================================================
     1. ブート画面（PRESS START）
  ========================================================= */
  #boot-screen{
    position: fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 40px;
    background: var(--bg-outer-2) url('assets/boot-bg.jpg') center 32% / cover no-repeat;
    z-index: 500;
    cursor: pointer;
    user-select:none;
    overflow: hidden;
  }
  #boot-screen::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.05) 40%, rgba(0,0,0,.35));
    z-index: 0;
  }
  #boot-logo{
    position: relative;
    z-index: 1;
    font-family: var(--font-pixel-jp);
    font-size: clamp(26px, 7vw, 48px);
    color:#fff;
    text-shadow: 4px 4px 0 var(--window-border-outer);
    text-align:center;
    line-height:1.8;
    letter-spacing: 2px;
  }
  #boot-logo small{
    display:block;
    font-family: var(--font-pixel-jp);
    font-size: .4em;
    color:#ffe083;
    margin-top: 14px;
    letter-spacing: 1px;
  }
  #press-start{
    position: relative;
    z-index: 1;
    font-family: var(--font-pixel-en);
    font-size: clamp(14px, 3vw, 20px);
    color:#fff;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 0%,50%{opacity:1;} 51%,100%{opacity:0;} }

  #boot-loading{
    position: relative;
    z-index: 1;
    width: min(260px, 70vw);
    height: 14px;
    border: 3px solid #fff;
    display:none;
    box-shadow: 0 0 0 3px var(--window-border-outer);
  }
  #boot-loading > i{
    display:block; height:100%; width:0%;
    background: repeating-linear-gradient(90deg, #ffe083 0 6px, #ffcf3d 6px 12px);
    animation: loadbar .7s steps(20) forwards;
  }
  @keyframes loadbar{ from{ width:0%; } to{ width:100%; } }

  #copyright-line{
    position:absolute; bottom: 18px;
    z-index: 1;
    font-family: var(--font-pixel-jp);
    font-size: 11px;
    color:#cfcff0;
  }

  /* =========================================================
     2. ゲーム本体コンテナ
  ========================================================= */
  #game-container{
    display:none;
    min-height:100vh;
    flex-direction:column;
    max-width: 980px;
    margin: 0 auto;
    padding: 14px;
  }
  #game-container.active{ display:flex; }

  /* ---- 上部ステータスバー ---- */
  #status-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 8px 14px;
    margin-bottom: 12px;
  }
  #status-bar .brand{
    font-family: var(--font-pixel-en);
    font-size: 11px;
    color:#fff;
    text-shadow: 2px 2px 0 var(--window-border-outer);
    letter-spacing:1px;
  }
  #status-controls{ display:flex; gap:8px; align-items:center; }
  .icon-btn{
    background: var(--window-bg);
    border: 3px solid var(--window-border-outer);
    box-shadow: inset 0 0 0 2px var(--window-border-inner);
    width: 34px; height: 34px;
    display:flex; align-items:center; justify-content:center;
    font-size: 15px;
    color: var(--text-color);
    clip-path: polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  }
  .icon-btn:active{ transform: translateY(1px); }

  /* =========================================================
     3. ピクセル風ウインドウ（GBA風テキストボックス）
  ========================================================= */
  .pixel-window{
    background: var(--window-bg);
    border: 4px solid var(--window-border-outer);
    box-shadow:
      inset 0 0 0 3px var(--window-border-inner),
      6px 6px 0 var(--shadow-color);
    clip-path: polygon(
      0 8px, 8px 8px, 8px 0,
      calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
      100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
      8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
    );
    padding: 18px 20px;
  }

  /* =========================================================
     4. メインレイアウト（メニュー + コンテンツ）
  ========================================================= */
  #main-layout{
    display:flex;
    gap: 14px;
    flex: 1;
    align-items: flex-start;
  }
  #menu-window{
    width: 210px;
    flex-shrink:0;
  }
  #menu-window h2{
    margin:0 0 10px;
    font-family: var(--font-pixel-en);
    font-size: 11px;
    color: var(--accent-2);
  }
  #menu-list{ list-style:none; margin:0; padding:0; }
  #menu-list li{
    padding: 9px 6px 9px 22px;
    position:relative;
    font-size: 15px;
    color: var(--text-color);
    cursor:pointer;
    border-radius:2px;
    margin-bottom: 2px;
  }
  #menu-list li::before{
    content:"";
    position:absolute; left:4px; top:50%;
    transform: translateY(-50%);
    width:0; height:0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 8px solid var(--accent);
    opacity:0;
    transition: opacity .1s;
  }
  #menu-list li.active{
    background: var(--menu-hover);
    font-weight:bold;
  }
  #menu-list li.active::before{
    opacity:1;
    animation: cursorMove .6s steps(2) infinite;
  }
  @keyframes cursorMove{ 0%,100%{ left:4px; } 50%{ left:1px; } }
  #menu-list li:hover{ background: var(--menu-hover); }

  #menu-footer{
    margin-top: 16px;
    padding-top: 12px;
    border-top: 2px dashed var(--text-sub);
    font-size: 11px;
    color: var(--text-sub);
    line-height:1.6;
  }

  /* ---- コンテンツウインドウ ---- */
  #content-window{
    flex:1;
    min-height: 420px;
    position:relative;
    overflow:hidden;
  }
  #page-content{
    animation: pageIn .35s ease;
  }
  #page-content.leaving{ animation: pageOut .2s ease forwards; }
  @keyframes pageIn{
    from{ opacity:0; transform: translateX(14px); clip-path: inset(0 0 0 100%); }
    to{ opacity:1; transform: translateX(0); clip-path: inset(0 0 0 0%); }
  }
  @keyframes pageOut{
    from{ opacity:1; transform: translateX(0); }
    to{ opacity:0; transform: translateX(-14px); }
  }

  .page-title{
    font-family: var(--font-pixel-en);
    font-size: 15px;
    color: var(--accent);
    margin: 0 0 16px;
    padding-bottom: 10px;
    border-bottom: 3px solid var(--accent);
    display:inline-block;
  }
  .page-content p{ line-height:1.9; font-size:15px; }
  .flavor{
    color: var(--text-sub);
    font-size: 13px;
    font-style: normal;
    border-left: 4px solid var(--accent-2);
    padding-left: 10px;
    margin: 14px 0;
  }

  /* ---- ステータス風テーブル（プロフィール等） ---- */
  .stat-table{ width:100%; border-collapse:collapse; margin: 14px 0; font-size:14px; }
  .stat-table tr{ border-bottom: 2px dotted var(--text-sub); }
  .stat-table td{ padding: 9px 6px; vertical-align:top; }
  .stat-table td:first-child{
    width: 32%; color: var(--accent-2); font-weight:bold; white-space:nowrap;
  }

  /* ---- 更新履歴 ---- */
  .log-list{ list-style:none; margin:0; padding:0; }
  .log-item{
    display:grid; grid-template-columns: 90px 60px 1fr;
    gap: 10px; padding: 10px 0; border-bottom: 2px dotted var(--text-sub);
    font-size: 14px; align-items:baseline;
  }
  .log-ver{ color:#fff; background: var(--accent); padding:2px 6px; font-size:11px; text-align:center; }
  .log-date{ color: var(--text-sub); font-size:12px; }

  /* ---- ブログ ---- */
  .blog-post{ padding: 14px 0; border-bottom: 2px dotted var(--text-sub); }
  .blog-post:last-child{ border-bottom:none; }
  .blog-post h3{ margin: 0 0 6px; font-size:16px; color: var(--text-color); }
  .blog-meta{ font-size:11px; color: var(--text-sub); margin-bottom:8px; }
  .blog-tag{
    display:inline-block; background: var(--menu-hover); color:var(--accent);
    font-size:10px; padding:2px 6px; margin-right:6px;
  }

  /* ---- 動画一覧(YouTube自動更新) ---- */
  .video-list{ list-style:none; margin:0; padding:0; }
  .video-item{ border-bottom: 2px dotted var(--text-sub); }
  .video-item:last-child{ border-bottom:none; }
  .video-item a{
    display:flex; align-items:center; gap:10px;
    padding: 10px 4px; text-decoration:none; color: var(--text-color);
  }
  .video-item a:hover{ background: var(--menu-hover); }
  .video-thumb{
    width: 96px; height: 54px; object-fit:cover; flex-shrink:0;
    border: 2px solid var(--window-border-outer);
  }
  .video-info{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .video-title{
    font-size: 13px; line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical;
  }
  .video-date{ font-size: 11px; color: var(--text-sub); }
  .video-new{
    display:inline-block; align-self:flex-start;
    background: var(--accent-2); color:#fff;
    font-size: 10px; padding: 1px 6px; margin-bottom:2px;
  }
  .yt-async{ color: var(--text-sub); font-size: 13px; padding: 8px 0; }
  .video-more-btn{
    display:block;
    width:100%;
    margin-top: 12px;
    padding: 10px;
    background: var(--window-bg);
    color: var(--text-color);
    border: 3px solid var(--window-border-outer);
    box-shadow: inset 0 0 0 2px var(--window-border-inner);
    font-family: inherit;
    font-size: 13px;
    cursor:pointer;
  }
  .video-more-btn:hover{ background: var(--menu-hover); }
  .video-more-btn:disabled{ opacity:.6; cursor:default; }

  /* ---- お問い合わせ ---- */
  .contact-btn{
    display:inline-block;
    margin-top: 10px;
    padding: 10px 18px;
    background: var(--accent);
    color:#fff;
    text-decoration:none;
    font-size: 13px;
    border: 3px solid var(--window-border-outer);
    box-shadow: 3px 3px 0 var(--shadow-color);
  }
  .contact-btn:active{ transform: translate(2px,2px); box-shadow:none; }

  /* ---- YouTube導線 ---- */
  .yt-btn{ background:#ff3b3b; margin-right:10px; }
  .yt-embed-wrap{
    position:relative; width:100%; padding-top:56.25%;
    margin: 14px 0; border: 3px solid var(--window-border-outer);
  }
  .yt-embed-wrap iframe{
    position:absolute; inset:0; width:100%; height:100%; border:0;
  }

  /* ---- 広告スロット ---- */
  .ad-slot{
    display:none;
    margin: 16px 0 0;
    padding: 8px;
    border: 3px dashed var(--text-sub);
    text-align:center;
    overflow:hidden;
  }

  #sns-links{
    display:flex; gap:10px; flex-wrap:wrap; margin-top: 18px;
  }
  .sns-btn{
    display:flex; align-items:center; gap:6px;
    padding: 8px 12px;
    background: var(--window-bg);
    border: 3px solid var(--window-border-outer);
    box-shadow: inset 0 0 0 2px var(--window-border-inner);
    text-decoration:none;
    color: var(--text-color);
    font-size: 12px;
  }
  .sns-btn:hover{ background: var(--menu-hover); }
  .sns-icon{ width:16px; height:16px; }

  /* =========================================================
     5. フッター
  ========================================================= */
  #site-footer{
    text-align:center;
    font-size: 11px;
    color:#e4e4ff;
    padding: 16px 0 6px;
  }

  /* =========================================================
     6. ワープ演出（Lainモードへの切替時のトランジション）
  ========================================================= */
  #warp-overlay{
    position: fixed; inset:0;
    z-index: 2000;
    pointer-events:none;
    background: #000;
    clip-path: circle(0% at 50% 50%);
    opacity:0;
  }
  #warp-overlay::before{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      0deg, rgba(0,229,255,.5) 0 2px, transparent 2px 5px
    );
    mix-blend-mode: screen;
    opacity:.6;
  }
  #warp-overlay.warp-out{ animation: warpOut .6s cubic-bezier(.7,0,.3,1) forwards; }
  #warp-overlay.warp-in{ clip-path: circle(150% at 50% 50%); opacity:1; animation: warpIn .6s cubic-bezier(.7,0,.3,1) forwards; }
  @keyframes warpOut{
    0%{ clip-path: circle(0% at 50% 50%); opacity:0; }
    12%{ opacity:1; }
    100%{ clip-path: circle(150% at 50% 50%); opacity:1; }
  }
  @keyframes warpIn{
    0%{ clip-path: circle(150% at 50% 50%); opacity:1; }
    100%{ clip-path: circle(0% at 50% 50%); opacity:0; }
  }

  /* =========================================================
     7. モバイル用ハンバーガー & レスポンシブ
  ========================================================= */
  #menu-toggle{ display:none; }

  @media (max-width: 720px){
    #main-layout{ flex-direction:column; }
    #menu-window{
      width:100%;
    }
    #menu-list{
      display:flex; overflow-x:auto; gap:6px; padding-bottom:4px;
    }
    #menu-list li{
      padding: 8px 12px; white-space:nowrap; font-size:13px;
    }
    #menu-list li::before{ display:none; }
    #menu-footer{ display:none; }
    .pixel-window{ padding: 14px; }
    #boot-logo{ padding: 0 10px; }
    .log-item{ grid-template-columns: 70px 50px 1fr; font-size:12.5px; }
  }
</style>
</head>

<div id="warp-overlay"></div>

<!-- ============================================================
     ブート画面（PRESS START）
============================================================ -->
<div id="boot-screen" role="button" tabindex="0" aria-label="PUSH START でサイトへ進む">
  <div id="boot-logo">

  <div id="status-bar">
    <div class="brand">RYOTEI POKECA</div>
    <div id="status-controls">
      <button class="icon-btn" id="sound-toggle" title="サウンド切替" aria-label="サウンド切替">🔊</button>

<script>
(function(){
  "use strict";

  // ページ内容・YouTube連携などの共通データは content.js の window.SITE に入っている
  var PAGES = SITE.PAGES;
  var PAGE_ORDER = SITE.PAGE_ORDER;

  /* =========================================================
     効果音（WebAudio, 外部ファイル不要で軽量）
  ========================================================= */
  var soundOn = true;
  var audioCtx = null;
  function beep(freq, dur){
    if(!soundOn) return;
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = freq;
      gain.gain.value = 0.05;
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (dur || 0.08));
      osc.stop(audioCtx.currentTime + (dur || 0.08));
    }catch(e){ /* 対応していない環境は無視 */ }
  }

  /* =========================================================
     ブート画面 → メイン画面
  ========================================================= */
  var bootScreen = document.getElementById("boot-screen");
  var bootLoading = document.getElementById("boot-loading");
  var gameContainer = document.getElementById("game-container");
  var started = false;

  function startGame(){
    if(started) return;
    started = true;
    beep(880, 0.1);
    bootLoading.style.display = "block";
    setTimeout(function(){
      bootScreen.style.display = "none";
      gameContainer.classList.add("active");
      var initial = (location.hash || "#top").replace("#","");
      renderPage(PAGES[initial] ? initial : "top", true);
    }, 750);
  }

  bootScreen.addEventListener("click", startGame);
  bootScreen.addEventListener("keydown", function(e){
    if(e.key === "Enter" || e.key === " ") startGame();
  });
  window.addEventListener("keydown", function(e){
    if(!started && (e.key === "Enter" || e.key === " ")) startGame();
  });

  /* =========================================================
     メニュー操作 & ページ切り替え
  ========================================================= */
  var menuItems = Array.prototype.slice.call(document.querySelectorAll("#menu-list li"));
  var pageContentEl = document.getElementById("page-content");
  var currentIndex = 0;

  function renderPage(key, skipAnim){
    var page = PAGES[key];
    if(!page) return;
    currentIndex = PAGE_ORDER.indexOf(key);

    menuItems.forEach(function(li){
      li.classList.toggle("active", li.dataset.page === key);
    });

    function paint(){
      pageContentEl.innerHTML =
        '<h2 class="page-title">' + page.title + '</h2>' +
        '<div class="page-content">' + page.html() + '</div>';
      pageContentEl.classList.remove("leaving");
      if(typeof page.onMount === "function"){ page.onMount(); }
    }

    if(skipAnim){
      paint();
    } else {
      pageContentEl.classList.add("leaving");
      setTimeout(paint, 180);
    }

    if(location.hash !== "#" + key){
      history.pushState(null, "", "#" + key);
    }
  }

  menuItems.forEach(function(li){
    li.addEventListener("click", function(){
      beep(660, 0.07);
      if(li.dataset.href){
        location.href = li.dataset.href;
        return;
      }
      renderPage(li.dataset.page);
    });
  });

  window.addEventListener("keydown", function(e){
    if(!started) return;
    if(e.key === "ArrowDown"){
      currentIndex = (currentIndex + 1) % PAGE_ORDER.length;
      beep(440, 0.05);
      renderPage(PAGE_ORDER[currentIndex]);
    } else if(e.key === "ArrowUp"){
      currentIndex = (currentIndex - 1 + PAGE_ORDER.length) % PAGE_ORDER.length;
      beep(440, 0.05);
      renderPage(PAGE_ORDER[currentIndex]);
    }
  });

  window.addEventListener("popstate", function(){
    var key = (location.hash || "#top").replace("#","");
    if(PAGES[key]) renderPage(key, true);
  });

  /* =========================================================
     サウンド / ダークモード トグル
  ========================================================= */
  var soundToggle = document.getElementById("sound-toggle");
  soundToggle.addEventListener("click", function(){
    soundOn = !soundOn;
    soundToggle.textContent = soundOn ? "🔊" : "🔈";
    if(soundOn) beep(880, 0.06);
  });

  var themeToggle = document.getElementById("theme-toggle");
  var root = document.documentElement;
  function applyTheme(theme){
    root.setAttribute("data-theme", theme);
    themeToggle.textContent = theme === "dark" ? "☀" : "🌙";
    localStorage.setItem("ryotei-theme", theme);
  }
  var savedTheme = localStorage.getItem("ryotei-theme") ||
    (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "gba");
  applyTheme(savedTheme);
  themeToggle.addEventListener("click", function(){
    beep(550, 0.06);
    applyTheme(root.getAttribute("data-theme") === "dark" ? "gba" : "dark");
  });

  /* =========================================================
     Lainモード（別HTML=lain.htmlへワープ演出付きで移動する。
     ページの中身自体は content.js を共通利用しているので同じ）
  ========================================================= */
  var warpOverlay = document.getElementById("warp-overlay");

  // lain.htmlから「もどる」で帰ってきたときは、入場演出（円がすぼまる）を再生する
  if(sessionStorage.getItem("ryotei-warp-entry") === "1"){
    sessionStorage.removeItem("ryotei-warp-entry");
    warpOverlay.classList.add("warp-in");
    warpOverlay.addEventListener("animationend", function onEnd(){
      warpOverlay.classList.remove("warp-in");
      warpOverlay.removeEventListener("animationend", onEnd);
    });
  }

  var lainToggle = document.getElementById("lain-toggle");
  lainToggle.addEventListener("click", function(){
    beep(220, 0.25);
    warpOverlay.classList.add("warp-out");
    setTimeout(function(){
      location.href = "lain.html" + (location.hash || "");
    }, 560);
  });

})();
</script>

  s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_MEASUREMENT_ID;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag("js", new Date());
  gtag("config", GA_MEASUREMENT_ID);
})();
</script>
