<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>2D MODE Preview | RYOTEI</title>
  <meta name="description" content="RYOTEIサイトの実コンテンツを使用した2D MODE端末シェルのローカル検証ページです。">
  <link rel="stylesheet" href="assets/css/2d-tokens.css">
  <link rel="stylesheet" href="assets/css/preview-2d.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ryotei-2d-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.dataset.theme = saved;
          return;
        }
      } catch (error) {}
      document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }());
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <main class="terminal-shell" aria-labelledby="terminal-title">
    <header class="status-bar win2">
      <div class="status-identity">
        <p class="eyebrow">RYOTEI INFORMATION TERMINAL</p>
        <h1 id="terminal-title">RYOTEI / 2D MODE</h1>
      </div>
      <span class="hud-signal" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </span>
      <dl class="hud-readouts" aria-label="端末ステータス">
        <div class="hud-readout">
          <dt>SCREEN</dt>
          <dd id="screen-name">MENU</dd>
        </div>
        <div class="hud-readout">
          <dt>CURSOR</dt>
          <dd id="status-position">01/00</dd>
        </div>
        <div class="hud-readout hud-theme">
          <dt>THEME</dt>
          <dd id="status-theme">DARK</dd>
        </div>
      </dl>
      <div class="status-actions">
        <span class="mode-chip" aria-label="現在の表示モード">2D</span>
        <button id="theme-toggle" type="button" aria-label="配色テーマを切り替える" aria-pressed="false">THEME: <span>DARK</span></button>
      </div>
    </header>

    <section id="main-content" class="main-window win2" aria-label="メニューとコンテンツ">
      <nav class="menu-pane" aria-labelledby="menu-heading">
        <div class="pane-heading">
          <h2 id="menu-heading">MENU</h2>
          <span id="item-count" aria-hidden="true"></span>
        </div>
        <div id="menu-list" class="menu-list" role="listbox" aria-label="サイトメニュー" tabindex="0"></div>
      </nav>
      <article class="detail-pane" aria-labelledby="detail-title">
        <div class="pane-heading">
          <p class="eyebrow">CONTENT</p>
          <h2 id="detail-title">読み込み中</h2>
        </div>
        <div id="detail-content" class="detail-content"></div>
      </article>
    </section>

    <section class="message-window win2" aria-labelledby="message-heading" aria-live="polite">
      <p id="message-heading" class="message-label">MESSAGE</p>
      <p id="message-text">メニューを読み込んでいます。</p>
      <p class="key-hint" aria-hidden="true">↑↓ SELECT &nbsp; ENTER OPEN &nbsp; ESC MENU</p>
    </section>

    <aside class="ad-reserve" aria-label="広告掲載予定領域">
      <span>ADVERTISEMENT</span>
      <p>広告掲載用スペース（広告コード未導入）</p>
    </aside>
  </main>
  <script src="content.js"></script>
  <script src="assets/js/preview-2d.js"></script>
</body>
</html>
