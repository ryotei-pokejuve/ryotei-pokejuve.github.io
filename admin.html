<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>管理画面 - りょていのサイト</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://idnhamxtwxfcxflenxko.supabase.co;">
<link rel="icon" type="image/jpg" href="ryotei.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  :root{
    --font-pixel-en: 'Press Start 2P', monospace;
    --font-pixel-jp: 'DotGothic16', sans-serif;
    --bg-outer-1: #7b7bd6;
    --bg-outer-2: #4a4a9c;
    --window-bg: #f8f3e2;
    --window-border-outer: #2a2a4a;
    --window-border-inner: #ffffff;
    --text-color: #24243c;
    --text-sub: #55557a;
    --accent: #3d7fd4;
    --accent-2: #e0663f;
    --ok: #2f8f4e;
    --shadow-color: rgba(0,0,0,.35);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: var(--font-pixel-jp);
    color: var(--text-color);
    background: linear-gradient(160deg, var(--bg-outer-1), var(--bg-outer-2));
    min-height: 100vh;
  }
  a{ color: var(--accent); }
  button{ font-family: inherit; cursor:pointer; }

  #page-wrap{ max-width: 720px; margin: 0 auto; padding: 14px 12px 40px; }

  .back-link{
    display:inline-block; margin-bottom:8px;
    font-size: 12px; color:#fff; text-decoration:none;
    text-shadow: 2px 2px 0 var(--window-border-outer);
  }
  #brand{
    font-family: var(--font-pixel-en);
    font-size: 13px; color:#fff;
    text-shadow: 2px 2px 0 var(--window-border-outer);
    margin: 0 0 12px;
  }

  .pixel-window{
    background: var(--window-bg);
    border: 4px solid var(--window-border-outer);
    box-shadow: inset 0 0 0 3px var(--window-border-inner), 6px 6px 0 var(--shadow-color);
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .pixel-window h2{
    font-family: var(--font-pixel-en); font-size: 12px; color: var(--accent);
    border-bottom: 3px solid var(--accent); display:inline-block; padding-bottom:4px; margin: 0 0 14px;
  }

  label{ display:block; font-size: 12.5px; color: var(--text-sub); margin: 10px 0 4px; }
  input[type="text"], input[type="email"], input[type="password"], input[type="number"],
  input[type="datetime-local"], input[type="date"], input[type="search"], select, textarea{
    width:100%; padding: 9px; font-family: inherit; font-size: 14px;
    border: 3px solid var(--window-border-outer);
    box-shadow: inset 0 0 0 2px var(--window-border-inner);
    background:#fff; color: var(--text-color);
  }
  textarea{ resize: vertical; min-height: 50px; }
  .custom-field{ display:none; margin-top:6px; }
  .custom-field.open{ display:block; }
  .inline-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px; }
  .inline-actions .btn{ margin-top:0; }
  #new-set-panel{
    display:none; margin-top:10px; padding:10px;
    border:2px dashed var(--accent); background:rgba(61,127,212,.08);
  }
  #new-set-panel.open{ display:block; }

  .btn{
    padding: 10px 16px; font-size: 12.5px; min-height:44px;
    background: var(--accent); color:#fff;
    border: 3px solid var(--window-border-outer);
    box-shadow: 3px 3px 0 var(--shadow-color);
    margin-top: 12px; margin-right: 8px;
  }
  .btn:active{ transform: translate(2px,2px); box-shadow:none; }
  .btn.secondary{ background: #8b8bb8; }
  .btn.danger{ background: var(--accent-2); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .status-msg{ margin-top: 10px; padding: 8px 10px; font-size: 12.5px; border: 2px solid; display:none; }
  .status-msg.ok{ display:block; color: var(--ok); border-color: var(--ok); background: rgba(47,143,78,.08); }
  .status-msg.err{ display:block; color: var(--accent-2); border-color: var(--accent-2); background: rgba(224,102,63,.08); }

  #login-section{ max-width: 360px; margin: 40px auto 0; }
  #admin-section{ display:none; }

  #who-row{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
    margin-bottom: 14px; color:#fff; font-size: 12px;
    text-shadow: 1px 1px 0 var(--window-border-outer);
  }

  .search-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .search-row input[type="search"]{ flex: 1 1 160px; }
  .search-row select{ flex: 1 1 120px; }

  #admin-results{ list-style:none; margin: 12px 0 0; padding:0; }
  .result-row{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding: 8px 4px; border-bottom: 1px dotted var(--text-sub); font-size: 13px;
  }
  .result-row .r-name{ flex:1; min-width:0; }
  .result-main{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .result-text{ min-width:0; }
  .result-thumb{
    width:52px; height:72px; object-fit:contain; flex:0 0 auto;
    border:2px solid var(--window-border-outer); background:#fff;
  }
  .result-thumb-placeholder{
    width:52px; height:72px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--window-border-outer); background:#eee;
    font-size:9px; color:var(--text-sub); text-align:center;
  }
  #admin-result-count{ margin-top:10px; font-size:12px; color:var(--text-sub); text-align:center; }
  #admin-load-more-wrap{ text-align:center; margin-top:10px; display:none; }
  .result-row button{
    padding: 6px 10px; font-size: 11px; min-height: 36px;
    background: var(--accent); color:#fff; border: 2px solid var(--window-border-outer);
  }

  #image-preview-wrap{ margin-top: 8px; }
  #image-preview{ max-width: 120px; max-height: 160px; border: 2px solid var(--window-border-outer); display:none; }

  #price-card-results{ list-style:none; padding:0; margin:8px 0 0; }
  #price-card-results .result-row{ margin-bottom:8px; }
  #price-target{ font-size: 13px; padding: 8px; background: rgba(61,127,212,.1); border: 2px solid var(--accent); margin-bottom: 8px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

/* ===== Smartphone admin UI ===== */
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; }
button, input, select, textarea { font: inherit; }
button, select { touch-action: manipulation; }

@media (max-width: 720px){
  body{
    margin:0;
    padding:0;
    font-size:16px;
  }

  .container,
  .admin-wrap,
  main{
    width:100% !important;
    max-width:none !important;
    margin:0 !important;
    padding:10px !important;
    box-sizing:border-box;
  }

  .pixel-window{
    margin:0 0 12px !important;
    padding:12px !important;
    box-sizing:border-box;
  }

  h1{ font-size:1.35rem; line-height:1.35; }
  h2{ font-size:1.1rem; line-height:1.4; }

  .search-row{
    display:grid !important;
    grid-template-columns:1fr !important;
    gap:8px !important;
  }

  input,
  select,
  textarea,
  .btn{
    width:100%;
    min-width:0;
    box-sizing:border-box;
  }

  input,
  select,
  textarea{
    min-height:48px;
    font-size:16px; /* iPhoneの入力時自動ズーム防止 */
    padding:10px;
  }

  textarea{ min-height:90px; }

  .btn{
    min-height:48px;
    padding:10px 12px;
    font-size:16px;
  }

  .inline-actions{
    display:grid !important;
    grid-template-columns:1fr !important;
    gap:8px !important;
  }

  #admin-results{
    padding-left:0 !important;
    list-style:none;
  }

  #admin-results li{
    margin:0 0 8px;
  }

  #admin-results button,
  #admin-results a{
    min-height:48px;
    width:100%;
    box-sizing:border-box;
  }

  #image-preview-wrap{
    width:100%;
    max-width:320px;
    margin:8px auto;
  }

  #image-preview{
    display:block;
    width:100%;
    height:auto;
    max-height:440px;
    object-fit:contain;
  }

  #new-set-panel{
    padding:12px;
  }

  #price-target{
    overflow-wrap:anywhere;
  }

  /* 下部の保存操作を親指で押しやすくする */
  #card-form .mobile-sticky-save{
    position:sticky;
    bottom:0;
    z-index:20;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));
    background:var(--bg, #fff);
  }
}

@media (max-width: 380px){
  body{ font-size:15px; }
  .pixel-window{ padding:9px !important; }
}


  .bulk-toolbar{ margin:12px 0 4px; padding:10px; border:2px solid var(--accent); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .bulk-toolbar select,.bulk-toolbar input[type="text"]{ min-height:40px; }
  .bulk-check-label{ display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .bulk-check-label input,.result-select{ width:auto !important; min-height:auto !important; }
  .result-select{ transform:scale(1.25); margin:0 4px; flex:0 0 auto; }
  @media (max-width:720px){ .bulk-toolbar{display:grid;grid-template-columns:1fr}.bulk-check-label{min-height:44px} }

  /* ===== ショート掲載カード 価格一括編集 ===== */
  .short-price-toolbar{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    margin:8px 0 12px;
  }
  .short-price-toolbar input[type="search"]{ flex:1 1 220px; }
  .short-price-summary{
    font-size:12px; color:var(--text-sub); margin:6px 0 10px;
  }
  #short-price-list{
    display:grid; gap:12px;
  }
  .short-price-card{
    border:3px solid var(--window-border-outer);
    box-shadow:2px 2px 0 var(--shadow-color);
    background:#fff;
    padding:10px;
  }
  .short-price-head{
    display:flex; gap:10px; align-items:flex-start; margin-bottom:10px;
  }
  .short-price-meta{ flex:1; min-width:0; }
  .short-price-name{ font-size:15px; font-weight:bold; overflow-wrap:anywhere; }
  .short-price-sub{ font-size:11.5px; color:var(--text-sub); margin-top:3px; overflow-wrap:anywhere; }
  .short-price-badge{
    display:inline-block; margin-top:4px; padding:2px 6px;
    border:2px solid var(--ok); color:var(--ok); font-size:10px;
  }
  .short-price-badge.off{ border-color:var(--text-sub); color:var(--text-sub); }
  .short-price-grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(90px,1fr));
    gap:8px;
  }
  .short-price-field label{ margin:0 0 3px; font-size:10.5px; }
  .short-price-field input{
    min-height:42px;
    padding:7px;
    font-size:14px;
  }
  .short-price-field.changed input{
    border-color:var(--accent-2);
    background:rgba(224,102,63,.08);
  }
  .short-price-actions{
    display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:9px;
  }
  .short-price-actions .btn{ margin:0; min-height:38px; padding:6px 10px; font-size:11px; }
  .short-price-links{ display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
  .short-price-link{
    display:inline-block; padding:6px 8px; min-height:34px;
    border:2px solid var(--window-border-outer);
    background:#eee; color:var(--text-color); text-decoration:none; font-size:10px;
  }
  #short-price-empty{
    display:none; padding:14px; text-align:center; color:var(--text-sub);
    border:2px dashed var(--text-sub);
  }
  @media (max-width:720px){
    .short-price-toolbar{ display:grid; grid-template-columns:1fr; }
    .short-price-grid{ grid-template-columns:1fr 1fr; }
    .short-price-field.market{ grid-column:1 / -1; }
    .short-price-actions{ display:grid; grid-template-columns:1fr; }
    .short-price-links{ margin-left:0; display:grid; grid-template-columns:1fr 1fr 1fr; }
    .short-price-actions .btn,.short-price-link{ width:100%; text-align:center; min-height:44px; }
  }

</style>
</head>
<body>

<div id="page-wrap">
  <a class="back-link" href="index.html">← トップへもどる</a>
  <h1 id="brand">🔧 ADMIN</h1>

  <div id="login-section" class="pixel-window">
    <h2>LOGIN</h2>
    <form id="login-form">
      <label for="login-email">メールアドレス</label>
      <input id="login-email" type="email" autocomplete="username" autocomplete="username" required>
      <label for="login-password">パスワード</label>
      <input id="login-password" type="password" autocomplete="current-password" autocomplete="current-password" required>
      <button class="btn" type="submit">ログイン</button>
      <div id="login-status" class="status-msg"></div>
    </form>
  </div>

  <div id="admin-section">
    <div id="who-row">
      <span id="who-am-i"></span>
      <button class="btn secondary" id="logout-btn" type="button">ログアウト</button>
    </div>

    <div class="pixel-window">
      <h2>サイト表示設定</h2>
      <label for="search-default-sort">SEARCHページを開いたときの並び順</label>
      <select id="search-default-sort">
        <option value="default">標準</option>
        <option value="release_desc">最新版（パック発売日が新しい順）</option>
        <option value="name_asc">五十音順 あ→ん</option>
        <option value="name_desc">五十音順 ん→あ</option>
        <option value="number_asc">カード番号 小→大</option>
        <option value="number_desc">カード番号 大→小</option>
      </select>
      <div class="inline-actions">
        <button class="btn" id="site-settings-save" type="button">デフォルト表示を保存</button>
      </div>
      <div id="site-settings-status" class="status-msg"></div>
    </div>

    <div class="pixel-window">
      <h2>カード検索</h2>
      <div class="search-row">
        <input id="admin-search-input" type="search" placeholder="カード名・番号で検索">
        <select id="admin-filter-series"><option value="">シリーズ（すべて）</option></select>
        <select id="admin-filter-set"><option value="">パック（すべて）</option></select>
        <select id="admin-filter-rarity">
          <option value="">レアリティ（すべて）</option>
          <option value="__NULL__">未設定</option>
          <option value="ー">ー</option>
          <option value="C">C</option>
          <option value="U">U</option>
          <option value="R">R</option>
          <option value="RR">RR</option>
          <option value="RRR">RRR</option>
          <option value="AR">AR</option>
          <option value="SR">SR</option>
          <option value="SAR">SAR</option>
          <option value="UR">UR</option>
          <option value="HR">HR</option>
          <option value="PROMO">PROMO</option>
          <option value="CHR">CHR</option>
          <option value="CSR">CSR</option>
          <option value="S">S</option>
          <option value="SSR">SSR</option>
          <option value="ACE">ACE</option>
          <option value="K">K</option>
          <option value="MUR">MUR</option>
          <option value="BWR">BWR</option>
          <option value="旧裏R">旧裏R</option>
        </select>
        <button class="btn" id="admin-search-btn" type="button">検索</button>
      </div>
      <div id="admin-bulk-toolbar" class="bulk-toolbar">
        <label class="bulk-check-label"><input id="admin-select-page" type="checkbox"> 表示中を全選択</label>
        <span id="admin-selected-count">選択中 0件</span>
        <select id="admin-bulk-rarity">
          <option value="">変更後レアリティ</option>
          <option value="ー">ー</option>
          <option value="●">●</option><option value="◆">◆</option><option value="★">★</option><option value="★H">★H</option><option value="☆">☆</option>
          <option value="C">C</option><option value="U">U</option><option value="R">R</option>
          <option value="RR">RR</option><option value="RRR">RRR</option><option value="AR">AR</option>
          <option value="SR">SR</option><option value="SAR">SAR</option><option value="UR">UR</option><option value="HR">HR</option>
          <option value="PROMO">PROMO</option><option value="プロモ">プロモ</option>
          <option value="CHR">CHR</option><option value="CSR">CSR</option><option value="S">S</option><option value="SSR">SSR</option>
          <option value="ACE">ACE</option><option value="K">K</option><option value="MUR">MUR</option><option value="BWR">BWR</option>
          <option value="__CUSTOM__">その他を入力…</option>
        </select>
        <input id="admin-bulk-rarity-custom" type="text" maxlength="40" placeholder="任意のレアリティ" style="display:none">
        <button class="btn" id="admin-bulk-apply" type="button" disabled>選択カードを一括変更</button>
        <div id="admin-bulk-status" class="status-msg"></div>
      </div>
      <ul id="admin-results"></ul>
      <div id="admin-result-count"></div>
      <div id="admin-load-more-wrap">
        <button class="btn secondary" id="admin-load-more-btn" type="button">もっと見る</button>
      </div>
    </div>

    <div class="pixel-window">
      <h2 id="card-form-title">カード新規登録</h2>
      <form id="card-form">
        <input type="hidden" id="card-id">
        <label for="card-set">パック</label>
        <select id="card-set" required></select>
        <div class="inline-actions">
          <button class="btn secondary" type="button" id="new-set-toggle">＋ 新しいパックを追加</button>
        </div>
        <div id="new-set-panel">
          <label for="new-set-code">パックコード</label>
          <input id="new-set-code" type="text" maxlength="40" placeholder="例: SV99">
          <label for="new-set-name">パック名</label>
          <input id="new-set-name" type="text" maxlength="120" placeholder="例: ハイクラスパック ○○">
          <label for="new-set-release-date">発売日（任意）</label>
          <input id="new-set-release-date" type="date">
          <div class="inline-actions">
            <button class="btn" type="button" id="new-set-save">パックを登録</button>
            <button class="btn secondary" type="button" id="new-set-cancel">キャンセル</button>
          </div>
          <div id="new-set-status" class="status-msg"></div>
        </div>
        <label for="card-name">カード名</label>
        <input id="card-name" type="text" required>
        <label for="card-number">番号</label>
        <input id="card-number" type="text" required>
        <label for="card-rarity">レアリティ</label>
        <select id="card-rarity">
          <option value="">未設定</option>
          <option value="ー">ー</option>
          <option value="C">C</option>
          <option value="U">U</option>
          <option value="R">R</option>
          <option value="RR">RR</option>
          <option value="RRR">RRR</option>
          <option value="AR">AR</option>
          <option value="SR">SR</option>
          <option value="SAR">SAR</option>
          <option value="UR">UR</option>
          <option value="HR">HR</option>
          <option value="PROMO">PROMO</option>
          <option value="CHR">CHR</option>
          <option value="CSR">CSR</option>
          <option value="S">S</option>
          <option value="SSR">SSR</option>
          <option value="ACE">ACE</option>
          <option value="K">K</option>
          <option value="MUR">MUR</option>
          <option value="BWR">BWR</option>
          <option value="旧裏R">旧裏R</option>
          <option value="__CUSTOM__">＋ カスタム入力</option>
        </select>
        <div id="card-rarity-custom-wrap" class="custom-field">
          <input id="card-rarity-custom" type="text" maxlength="40" placeholder="例: ☆ / ★ / LEGEND">
        </div>
        <label for="card-variant">バリアント（ホロ・ミラー等の識別。通常は空欄でよい）</label>
        <input id="card-variant" type="text">
        <label for="card-image-url">画像URL（https のみ）</label>
        <input id="card-image-url" type="text" placeholder="https://...">
        <div id="image-preview-wrap"><img id="image-preview" alt="プレビュー"></div>
        <label for="card-image-note">画像の出典メモ（任意）</label>
        <textarea id="card-image-note"></textarea>

        <div id="short-feature-box" style="margin-top:14px;padding:10px;border:2px dashed var(--accent);background:rgba(61,127,212,.08);">
          <label style="display:flex;align-items:center;gap:8px;color:var(--text-color);">
            <input id="short-feature-active" type="checkbox" style="width:auto;min-height:auto;">
            PRICEページに掲載する
          </label>
          <label for="short-feature-published">動画投稿日（任意）</label>
          <input id="short-feature-published" type="datetime-local">
          <button class="btn secondary" type="button" id="short-feature-save" disabled>掲載設定を保存</button>
          <div id="short-feature-status" class="status-msg"></div>
        </div>

        <div class="mobile-sticky-save">
          <button class="btn" type="submit" id="card-submit-btn">登録する</button>
          <button class="btn secondary" type="button" id="card-reset-btn">新規登録にリセット</button>
        </div>
        <div id="card-status" class="status-msg"></div>
      </form>
    </div>


    <div class="pixel-window">
      <h2>ショート掲載カード 価格一括編集</h2>
      <div style="font-size:12px;color:var(--text-sub);margin-bottom:8px;">
        ショート動画に載せたカードだけを一覧表示します。複数カードの価格を直して、最後にまとめて保存できます。
        空欄は「変更なし」です。
      </div>

  };


  // パックをシリーズ別にまとめてプルダウン表示する。
  // APIがcodeを返す場合はcodeを優先し、返さない場合はnameから判定する。
  function getSetGroup(s){
    // DBにseries_nameがある場合は、それをそのまま管理画面のシリーズ名として使う。
    // これにより今後シリーズやパックを追加してもadmin.html側のハードコード更新が不要。
    var explicit = String((s && s.series_name) || "").trim();
    if(explicit) return explicit;

    // 旧データなどseries_name未設定行だけ従来ルールで補完する。
    var code = String((s && s.code) || "").trim().toUpperCase();
    var name = String((s && s.name) || "").trim();
    var key = code || name.toUpperCase();

    if(/プロモ/.test(name) || /^(SV-P|S8A-P|S-P|SMP|XYP|BWP|LP|DPTP|DPP|PCGP|ADVP|PPP|PLAY)$/.test(code)) return "プロモ";
    if(/^SV/.test(key)) return "SVシリーズ";
    if(/^SM/.test(key)) return "SMシリーズ";
    if(/^XY/.test(key)) return "XYシリーズ";
    if(/^BW/.test(key)) return "BWシリーズ";
    if(/^(L1|L2|L3|LL$|LP$|BK$|BR$|EL$|EM$)/.test(key)) return "LEGEND";
    if(/^(DPT|DP)/.test(key)) return "DP・DPtシリーズ";
    if(/^(ADV|PCG)/.test(key)) return "ADV・PCGシリーズ";
    if(/^(PMCG|NEO|VND|E\b|WEB\b|VS\b)/.test(key)) return "旧裏・e・VS";
    if(/^S(?:\d|[A-Z-])/.test(key)) return "ソード・シールド";
    return "その他";
  }

  function setOptionLabel(s){
    var code = String((s && s.code) || "").trim();
    var name = String((s && s.name) || "").trim();
    var series = String((s && s.series_name) || "").trim();

    // 統合済みプレイヤーズは内部コードPLAYを画面には出さない。
    if(series === "プレイヤーズ" && name === "プレイヤーズ") return "プレイヤーズ";
    return code && name && name.indexOf(code) !== 0 ? code + "  " + name : (name || code);
  }

  function appendGroupedSetOptions(select, sets){
    var groups = {};
    var order = {};

    (sets || []).forEach(function(s){
      var label = getSetGroup(s);
      if(!groups[label]) groups[label] = [];
      groups[label].push(s);

      var n = Number(s && s.series_order);
      if(!Number.isFinite(n)) n = 500;
      order[label] = Math.min(order[label] == null ? 9999 : order[label], n);
    });

    Object.keys(groups).sort(function(a, b){
      return (order[a] - order[b]) || a.localeCompare(b, "ja");
    }).forEach(function(label){
      var rows = groups[label];

      // 旧裏・e・VSは発売日順。それ以外は表示名順。
      if(label === "旧裏・e・VS"){
        rows.sort(function(a, b){
          var ad = String((a && a.release_date) || "9999-12-31");
          var bd = String((b && b.release_date) || "9999-12-31");
          return ad.localeCompare(bd) ||
            setOptionLabel(a).localeCompare(setOptionLabel(b), "ja", { numeric:true });
        });
      } else {
        rows.sort(function(a, b){
          return setOptionLabel(a).localeCompare(setOptionLabel(b), "ja", { numeric:true });
        });
      }

      var group = document.createElement("optgroup");
      group.label = label;
      rows.forEach(function(s){
        var opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = setOptionLabel(s);
        group.appendChild(opt);
      });
      select.appendChild(group);
    });
  }

  var allAdminCardSets = [];

  function rebuildAdminSeriesOptions(selectedName){
    var previous = selectedName || "";
    els.filterSeries.innerHTML = '<option value="">シリーズ（すべて）</option>';

    var map = {};
    (allAdminCardSets || []).forEach(function(s){
      var name = getSetGroup(s);
      var n = Number(s && s.series_order);
      if(!Number.isFinite(n)) n = 500;
      if(!map[name] || n < map[name].order) map[name] = { order:n };
    });

    Object.keys(map).sort(function(a, b){
      return (map[a].order - map[b].order) || a.localeCompare(b, "ja");
    }).forEach(function(name){
      var opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      els.filterSeries.appendChild(opt);
    });

    if(previous) els.filterSeries.value = previous;
  }

  function rebuildAdminPackFilter(selectedSetId){
    var seriesName = String(els.filterSeries.value || "").trim();
    clearSetOptions(els.filterSet, "パック（すべて）");

    var rows = (allAdminCardSets || []).filter(function(s){
      return !seriesName || getSetGroup(s) === seriesName;
    });
    appendGroupedSetOptions(els.filterSet, rows);

    if(selectedSetId) els.filterSet.value = selectedSetId;
  }


  var selectedCardId = null;
  var setsLoaded = false;
  var adminSearchOffset = 0;
  var adminSearchTotal = 0;
  var adminSearchLoading = false;
  var ADMIN_PAGE_SIZE = 20;
  var adminSelectedIds = new Set();

  function updateBulkUI(){
    var count = adminSelectedIds.size;
    els.selectedCount.textContent = "選択中 " + count + "件";
    els.bulkApply.disabled = count === 0;
    var checks = Array.prototype.slice.call(els.results.querySelectorAll(".result-select"));
    els.selectPage.checked = checks.length > 0 && checks.every(function(c){ return c.checked; });
    els.selectPage.indeterminate = checks.some(function(c){ return c.checked; }) && !els.selectPage.checked;
  }

  function clearBulkSelection(){
    adminSelectedIds.clear();
    Array.prototype.forEach.call(els.results.querySelectorAll(".result-select"), function(c){ c.checked = false; });
    clearStatus(els.bulkStatus);
    updateBulkUI();
  }
  var priceSearchOffset = 0;
  var priceSearchTotal = 0;
  var priceSearchLoading = false;
  var PRICE_SEARCH_PAGE_SIZE = 20;

  function showStatus(el, message, isError){
    el.textContent = message;
    el.className = "status-msg " + (isError ? "err" : "ok");
  }
  function clearStatus(el){
    el.textContent = "";
    el.className = "status-msg";
  }

  // よくあるDBエラーメッセージを分かりやすい日本語にする
  function friendlyError(err){
    var msg = (err && err.message) || String(err);
    if(msg.indexOf("not authorized") !== -1) return "管理者権限がありません。管理者アカウントでログインしているか確認してください。";
    if(msg.indexOf("price must be positive") !== -1) return "価格は1円以上で入力してください。";
    if(msg.indexOf("observed_at is invalid") !== -1) return "日時が不正か、未来すぎます。";
    if(msg.indexOf("card not found") !== -1) return "対象のカードが見つかりませんでした。";
    if(msg.indexOf("set_id, name, card_number are required") !== -1) return "パック・カード名・番号は必須です。";
    return msg;
  }

  function nowForDatetimeLocal(){
    var d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  }

  function isoToDatetimeLocal(iso){
    if(!iso) return "";
    var d = new Date(iso);
    if(isNaN(d.getTime())) return "";
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  }

  var priceSourceById = {};

  function updatePriceTypeForSource(){
    var source = priceSourceById[els.priceSource.value];
    var isMercari = !!(source && source.name === "メルカリ");
    els.shopPricePair.style.display = isMercari ? "none" : "block";
    els.marketPriceSingle.style.display = isMercari ? "block" : "none";
    if(isMercari){
      els.priceSellValue.value = "";
      els.priceBuyValue.value = "";
    } else {
      els.priceMarketValue.value = "";
    }
  }

  function loadPriceSources(){
    return ADMIN.listPriceSources().then(function(rows){
      priceSourceById = {};
      els.priceSource.innerHTML = '<option value="">価格元を選択</option>';
      (rows || []).forEach(function(row){
        priceSourceById[row.id] = row;
        var opt = document.createElement("option");
        opt.value = row.id;
        opt.textContent = row.name;
        els.priceSource.appendChild(opt);
      });
      updatePriceTypeForSource();
    }).catch(function(err){
      console.error(err);
      showStatus(els.priceStatus, "価格元の読み込みに失敗しました: " + friendlyError(err), true);
    });
  }

  els.priceSource.addEventListener("change", updatePriceTypeForSource);

  // ---- サイト表示設定 ----
  var SEARCH_SORT_VALUES = ["default", "release_desc", "name_asc", "name_desc", "number_asc", "number_desc"];

  function loadSiteSettings(){
    clearStatus(els.siteSettingsStatus);
    return ADMIN.getSiteSetting("search_default_sort").then(function(value){
      if(SEARCH_SORT_VALUES.indexOf(value) !== -1){
        els.searchDefaultSort.value = value;
      } else {
        els.searchDefaultSort.value = "default";
      }
    }).catch(function(err){
      console.error(err);
      els.searchDefaultSort.value = "default";
      showStatus(els.siteSettingsStatus, "表示設定の読み込みに失敗しました。DB更新SQLが未適用の可能性があります。", true);
    });
  }

  els.siteSettingsSave.addEventListener("click", function(){
    var value = els.searchDefaultSort.value;
    if(SEARCH_SORT_VALUES.indexOf(value) === -1){
      showStatus(els.siteSettingsStatus, "並び順の指定が不正です。", true);
      return;
    }
    els.siteSettingsSave.disabled = true;
    clearStatus(els.siteSettingsStatus);
    ADMIN.adminSetSiteSetting("search_default_sort", value).then(function(){
      // 保存直後にDBから読み返し、実際に反映された値まで確認する。
      return ADMIN.getSiteSetting("search_default_sort");
    }).then(function(savedValue){
      if(savedValue !== value){
        throw new Error("保存値の確認に失敗しました（DB値: " + String(savedValue) + "）");
      }
      showStatus(els.siteSettingsStatus, "SEARCHページのデフォルト表示を保存しました（DB確認済み）。", false);
    }).catch(function(err){
      console.error(err);
      showStatus(els.siteSettingsStatus, "保存に失敗しました: " + friendlyError(err), true);
    }).finally(function(){
      els.siteSettingsSave.disabled = false;
    });
  });

  // ---- ログイン状態の切り替え ----
  // ログアウト状態（初期表示・手動ログアウト・セッション失効・管理者以外のログイン、すべて共通）に
  // 戻すときは、フォームや検索結果、選択中カードなど画面上の情報を必ずクリアする。
  function showLoggedOut(){
    els.loginSection.style.display = "block";
    els.adminSection.style.display = "none";
    els.loginPassword.value = "";
    els.results.innerHTML = "";
    resetCardForm();
  }
  function showLoggedIn(session){
    els.loginSection.style.display = "none";
    els.adminSection.style.display = "block";
    els.whoAmI.textContent = "ログイン中: " + (session && session.user && session.user.email || "");
    if(!setsLoaded){
      setsLoaded = true;
      loadCardSets();
      loadPriceSources();
        loadShortPriceCards();
    }
    loadSiteSettings();
    runAdminSearch();
  }

  // ログイン済みでも、実際に管理者（admin_users登録済み）でなければ管理UIを表示しない。
  // 判定自体はDB側（is_admin）が最終的な境界であり、これはあくまでUIの出し分け。
  function handleSessionChange(session){
    if(!session){
      showLoggedOut();
      return;
    }
    ADMIN.checkAdminAccess().then(function(isAdmin){
      if(!isAdmin){
        return ADMIN.logout().then(function(){
          showLoggedOut();
          showStatus(els.loginStatus, "このアカウントには管理者権限がありません。", true);
        });
      }

      // 権限確認後のUI初期化エラーを「権限確認失敗」と誤表示しない。
      try {
        showLoggedIn(session);
      } catch (uiErr) {
        console.error("admin UI init failed", uiErr);
        showStatus(els.loginStatus, "管理画面の初期化に失敗しました: " + friendlyError(uiErr), true);
      }
    }, function(err){
      console.error(err);
      ADMIN.logout().then(function(){
        showLoggedOut();
        showStatus(els.loginStatus, "権限の確認に失敗しました。もう一度ログインしてください。", true);
      });
    });
  }

  // onAuthStateChange は初期状態(INITIAL_SESSION)も通知するため、
  // getSession() を同時に走らせない。二重の admin_check_access を防ぐ。
  ADMIN.onAuthChange(handleSessionChange);

  els.loginForm.addEventListener("submit", function(e){
    e.preventDefault();
    clearStatus(els.loginStatus);
    ADMIN.login(els.loginEmail.value, els.loginPassword.value).catch(function(err){
      showStatus(els.loginStatus, friendlyError(err) === err.message ? "ログインに失敗しました（メールアドレスかパスワードが違います）。" : friendlyError(err), true);
    });
  });

  els.logoutBtn.addEventListener("click", function(){
    ADMIN.logout();
  });

  // ---- パック一覧の読み込み（検索フィルタ・登録フォーム両方で使う） ----
  function clearSetOptions(select, firstLabel){
    select.innerHTML = "";
    var first = document.createElement("option");
    first.value = "";
    first.textContent = firstLabel;
    select.appendChild(first);
  }

  function loadCardSets(selectCardId){
    return MARKET.listCardSets().then(function(sets){
      var previousSeries = els.filterSeries.value;
      var previousFilter = els.filterSet.value;
      var previousCard = selectCardId || els.cardSet.value;

      allAdminCardSets = sets || [];

      // 検索側: DBのseries_nameからシリーズ一覧を自動生成し、
      // 選択シリーズに属するパックだけをパック欄へ表示。
      rebuildAdminSeriesOptions(previousSeries);
      rebuildAdminPackFilter(previousFilter);

      // カード登録側: 全パックをDBのseries_nameごとに自動グループ化。
      clearSetOptions(els.cardSet, "パックを選択");
      appendGroupedSetOptions(els.cardSet, allAdminCardSets);
      if(previousCard) els.cardSet.value = previousCard;

      return allAdminCardSets;
    }).catch(function(err){
      console.error(err);
      throw err;
    });
  }


  // ---- 新しいパックの追加 ----
  function setNewSetPanel(open){
    els.newSetPanel.classList.toggle("open", !!open);
    if(open){
      clearStatus(els.newSetStatus);
      els.newSetName.focus();
    }
  }

  els.newSetToggle.addEventListener("click", function(){
    setNewSetPanel(!els.newSetPanel.classList.contains("open"));
  });

  els.newSetCancel.addEventListener("click", function(){
    setNewSetPanel(false);
    els.newSetCode.value = "";
    els.newSetName.value = "";
    els.newSetReleaseDate.value = "";
    clearStatus(els.newSetStatus);
  });

  els.newSetSave.addEventListener("click", function(){
    clearStatus(els.newSetStatus);

    var name = els.newSetName.value.trim();
    var code = els.newSetCode.value.trim();
    var releaseDate = els.newSetReleaseDate.value || null;

    if(!name){
      showStatus(els.newSetStatus, "パック名を入力してください。", true);
      els.newSetName.focus();
      return;
    }

    els.newSetSave.disabled = true;
    ADMIN.adminCreateCardSet({
      code: code,
      name: name,
      releaseDate: releaseDate
    }).then(function(newSetId){
      return loadCardSets(newSetId).then(function(){
        els.newSetSave.disabled = false;
        els.cardSet.value = newSetId;
        showStatus(els.newSetStatus, "パックを登録しました。このパックを選択しています。", false);
        els.newSetCode.value = "";
        els.newSetName.value = "";

  function updateAdminSearchFooter(){
    var shown = els.results.children.length;
    if(adminSearchTotal > 0){
      els.resultCount.textContent = shown + " / " + adminSearchTotal + "件表示";
    } else {
      els.resultCount.textContent = shown ? shown + "件表示" : "検索結果はありません";
    }
    els.loadMoreWrap.style.display = shown < adminSearchTotal ? "block" : "none";
  }

  function runAdminSearch(append){
    if(adminSearchLoading) return;
    adminSearchLoading = true;

    if(!append){
      adminSearchOffset = 0;
      adminSearchTotal = 0;
      els.results.innerHTML = "";
      adminSelectedIds.clear();
      clearStatus(els.bulkStatus);
      updateBulkUI();
      els.resultCount.textContent = "読み込み中...";
      els.loadMoreWrap.style.display = "none";
    }

    els.loadMoreBtn.disabled = true;
    els.loadMoreBtn.textContent = "読み込み中...";

    MARKET.searchCardsSorted({
      query: els.searchInput.value,
      rarity: els.filterRarity.value || null,
      setId: els.filterSet.value || null,
      seriesName: els.filterSeries.value || null,
      limit: ADMIN_PAGE_SIZE,
      offset: adminSearchOffset
    }).then(function(rows){
      rows = rows || [];
      if(rows.length && rows[0].total_count != null){
        adminSearchTotal = Number(rows[0].total_count) || 0;
      }
      rows.forEach(renderAdminResult);
      adminSearchOffset += rows.length;
      updateAdminSearchFooter();
    }).catch(function(err){
      console.error(err);
      if(!append) els.resultCount.textContent = "検索に失敗しました";
    }).finally(function(){
      adminSearchLoading = false;
      els.loadMoreBtn.disabled = false;
      els.loadMoreBtn.textContent = "もっと見る";
    });
  }

  function isBuiltInRarity(value){
    var builtIn = ["", "ー", "C", "U", "R", "RR", "RRR", "AR", "SR", "SAR", "UR", "HR",
      "PROMO", "CHR", "CSR", "S", "SSR", "ACE", "K", "MUR", "BWR", "旧裏R"];
    return builtIn.indexOf(value || "") !== -1;
  }

  function updateCustomRarityUI(){
    var custom = els.cardRarity.value === "__CUSTOM__";

      els.cardRarityCustom.focus();

      return els.cardRarity.value;
    }
    return els.cardRarityCustom.value.trim();

  function setCardRarityValue(value){

      els.cardRarityCustom.value = "";

  // ---- ショート掲載カード 価格一括編集 ----
  var shortPriceRows = [];
  var shortPriceOriginal = {};
  var shortPriceDirty = new Set();
  var shortPriceLoading = false;

  function moneyInputValue(v){
    if(v == null || v === "") return "";
    var n = Number(v);
    return isFinite(n) && n > 0 ? String(Math.round(n)) : "";
  }

  function shortPriceKey(cardId, field){
    return String(cardId) + "::" + field;
  }

  function setShortPriceDirty(cardId, field, input){
    var key = shortPriceKey(cardId, field);
    var oldValue = shortPriceOriginal[key] || "";
    var newValue = String(input.value || "").trim();
    if(newValue !== oldValue){
      shortPriceDirty.add(key);
      input.closest(".short-price-field").classList.add("changed");
    }else{
      shortPriceDirty.delete(key);
      input.closest(".short-price-field").classList.remove("changed");
    }
    els.shortPriceSaveAll.disabled = shortPriceDirty.size === 0 || shortPriceLoading;
    updateShortPriceSummary();
  }

  function updateShortPriceSummary(){
    var shown = els.shortPriceList.querySelectorAll(".short-price-card:not([hidden])").length;
    els.shortPriceSummary.textContent =
      "表示 " + shown + " / 全 " + shortPriceRows.length + "件　変更 " + shortPriceDirty.size + "項目";
  }

  function priceSearchUrl(site, row){
    var q = [row.card_name, row.card_number, row.set_code].filter(Boolean).join(" ");
    if(site === "cardrush"){
      return "https://www.cardrush-pokemon.jp/product-list?keyword=" + encodeURIComponent(q);
    }
    if(site === "hareruya"){
      return "https://www.hareruya2.com/search?type=product&q=" + encodeURIComponent(q);
    }
    if(site === "mercari"){
      return "https://jp.mercari.com/search?keyword=" + encodeURIComponent(q);
    }
    return "#";
  }

  function makeShortPriceField(cardId, field, label, value, extraClass){
    var wrap = document.createElement("div");
    wrap.className = "short-price-field" + (extraClass ? " " + extraClass : "");

    var lab = document.createElement("label");
    lab.textContent = label;
    wrap.appendChild(lab);

    var input = document.createElement("input");
    input.type = "number";
    input.min = "1";
    input.inputMode = "numeric";
    input.placeholder = "円";
    input.value = moneyInputValue(value);
    input.dataset.cardId = cardId;
    input.dataset.priceField = field;

    var key = shortPriceKey(cardId, field);
    shortPriceOriginal[key] = input.value;

    input.addEventListener("input", function(){
      setShortPriceDirty(cardId, field, input);
    });
    wrap.appendChild(input);
    return wrap;
  }

  function renderShortPriceRows(){
    els.shortPriceList.innerHTML = "";
    shortPriceOriginal = {};
    shortPriceDirty.clear();

    shortPriceRows.forEach(function(row){
      var box = document.createElement("div");

      var sub = document.createElement("div");

      var badge = document.createElement("span");

      meta.appendChild(badge);
      head.appendChild(meta);
      box.appendChild(head);

      var grid = document.createElement("div");
      grid.className = "short-price-grid";
      grid.appendChild(makeShortPriceField(row.card_id, "cardrush_sell", "カードラッシュ 販売", row.cardrush_sell));
      grid.appendChild(makeShortPriceField(row.card_id, "cardrush_buy", "カードラッシュ 買取", row.cardrush_buy));
      grid.appendChild(makeShortPriceField(row.card_id, "hareruya_sell", "晴れる屋2 販売", row.hareruya_sell));
      grid.appendChild(makeShortPriceField(row.card_id, "hareruya_buy", "晴れる屋2 買取", row.hareruya_buy));
      grid.appendChild(makeShortPriceField(row.card_id, "mercari_market", "メルカリ 相場", row.mercari_market, "market"));
      box.appendChild(grid);

      var actions = document.createElement("div");

        saveShortPriceChanges(row.card_id);
      });

      var links = document.createElement("div");
      links.className = "short-price-links";
      [
        ["Cardrush検索", "cardrush"],
        ["晴れる屋2検索", "hareruya"],

        var a = document.createElement("a");

  function applyShortPriceFilter(){

    Array.prototype.forEach.call(els.shortPriceList.querySelectorAll(".short-price-card"), function(box){

      els.shortPriceSummary.textContent = "読み込み失敗";

  var SHORT_PRICE_MAP = {
    cardrush_sell: { sourceName:"カードラッシュ", priceType:"sell" },
    cardrush_buy: { sourceName:"カードラッシュ", priceType:"buy" },
    hareruya_sell: { sourceName:"晴れる屋2", priceType:"sell" },
    hareruya_buy: { sourceName:"晴れる屋2", priceType:"buy" },
    mercari_market: { sourceName:"メルカリ", priceType:"market" }
  };

  function sourceIdByName(name){
    var found = null;
    Object.keys(priceSourceById).some(function(id){
      if(priceSourceById[id] && priceSourceById[id].name === name){
        found = id;
        return true;
      }
      return false;
    });
    return found;
  }

  function dirtyEntriesForCard(cardId){
    var prefix = String(cardId) + "::";
    return Array.from(shortPriceDirty).filter(function(key){
      return !cardId || key.indexOf(prefix) === 0;
    });
  }

  function runJobsSequentially(jobs, index){
    index = index || 0;
    if(index >= jobs.length) return Promise.resolve();
    return jobs[index]().then(function(){
      return runJobsSequentially(jobs, index + 1);
    });
  }

  function saveShortPriceChanges(cardId){
    var keys = dirtyEntriesForCard(cardId || null);
    if(!keys.length){
      showStatus(els.shortPriceStatus, "変更された価格はありません。", false);
      return;
    }

    clearStatus(els.shortPriceStatus);
    var jobs = [];
    var nowIso = new Date().toISOString();

    keys.forEach(function(key){
      var parts = key.split("::");
      var id = parts[0];
      var field = parts[1];
      var cfg = SHORT_PRICE_MAP[field];
      var input = els.shortPriceList.querySelector(
        'input[data-card-id="' + CSS.escape(id) + '"][data-price-field="' + CSS.escape(field) + '"]'
      );
      if(!cfg || !input) return;

      var value = Number(input.value);
      // 空欄は削除ではなく「変更しない」
      if(!(value > 0)) return;

      var sourceId = sourceIdByName(cfg.sourceName);
      if(!sourceId){
        jobs.push(function(){
          return Promise.reject(new Error(cfg.sourceName + " の price_source が見つかりません。"));
        });
        return;
      }

      jobs.push(function(){
        return ADMIN.adminRecordPrice({
          cardId: id,
          price: value,
          observedAt: nowIso,
          sourceId: sourceId,
          priceType: cfg.priceType,
          condition: "default"
        });
      });
    });

    if(!jobs.length){
      showStatus(els.shortPriceStatus, "空欄だけの変更は保存しません。価格を1円以上で入力してください。", true);
      return;
    }

    shortPriceLoading = true;
    els.shortPriceSaveAll.disabled = true;
    els.shortPriceReload.disabled = true;
    showStatus(els.shortPriceStatus, jobs.length + "件の価格を保存中…", false);

    runJobsSequentially(jobs).then(function(){
      shortPriceLoading = false;
      els.shortPriceReload.disabled = false;
      showStatus(els.shortPriceStatus, jobs.length + "件の価格を保存しました。", false);
      return loadShortPriceCards();
    }).catch(function(err){
      shortPriceLoading = false;
      els.shortPriceReload.disabled = false;
      els.shortPriceSaveAll.disabled = false;
      showStatus(els.shortPriceStatus, "保存に失敗しました: " + friendlyError(err), true);
    });
  }

  els.shortPriceReload.addEventListener("click", loadShortPriceCards);
  els.shortPriceSaveAll.addEventListener("click", function(){ saveShortPriceChanges(null); });
  els.shortPriceFilter.addEventListener("input", applyShortPriceFilter);
  els.shortPriceActiveOnly.addEventListener("change", applyShortPriceFilter);

  // ---- 価格登録専用カード検索 ----
  function appendPriceCardResult(card){
    var li = document.createElement("li");
    li.className = "result-row";

    var main = document.createElement("div");
    main.className = "result-main";

    var safeImage = MARKET.sanitizeImageUrl(card.image_url || "");
    if(safeImage){
      var img = document.createElement("img");
      img.className = "result-thumb";
      img.src = safeImage;
      img.alt = "";
      img.loading = "lazy";
      main.appendChild(img);
    } else {
      var ph = document.createElement("div");
      ph.className = "result-thumb-placeholder";
      ph.textContent = "NO IMAGE";
      main.appendChild(ph);
    }

    var text = document.createElement("span");
    text.className = "r-name";
    text.textContent = card.name + "（" + (card.card_number || "") +
      (card.rarity ? " / " + card.rarity : "") + " / " + (card.set_name || "") + "）";
    main.appendChild(text);
    li.appendChild(main);

    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "価格登録";
    btn.addEventListener("click", function(){
      setPriceTarget(card.id, card.name + " / " + (card.set_name || "") + " / " + (card.card_number || ""));
      var src = priceSourceById[els.priceSource.value];
      if(src && src.name === "メルカリ") els.priceMarketValue.focus();
      else els.priceSellValue.focus();
    });
    li.appendChild(btn);
    els.priceCardResults.appendChild(li);
  }

  function runPriceCardSearch(append){
    if(priceSearchLoading) return;
    var q = els.priceCardSearch.value.trim();
    if(!q){
      els.priceCardResults.innerHTML = "";
      els.priceCardResultCount.textContent = "カード名またはカード番号を入力してください。";
      els.priceCardLoadMoreWrap.style.display = "none";
      return;
    }
    priceSearchLoading = true;
    if(!append){
      priceSearchOffset = 0;
      priceSearchTotal = 0;
      els.priceCardResults.innerHTML = "";
    }
    els.priceCardSearchBtn.disabled = true;
    els.priceCardLoadMore.disabled = true;

    MARKET.searchCardsSorted({
      query: q,
      limit: PRICE_SEARCH_PAGE_SIZE,
      offset: priceSearchOffset
    }).then(function(rows){
      rows = rows || [];
      rows.forEach(appendPriceCardResult);
      if(rows.length && rows[0].total_count != null) priceSearchTotal = Number(rows[0].total_count) || 0;
      priceSearchOffset += rows.length;
      els.priceCardResultCount.textContent = priceSearchOffset + " / " + priceSearchTotal + "件表示";
      els.priceCardLoadMoreWrap.style.display = priceSearchOffset < priceSearchTotal ? "block" : "none";
      els.priceCardSearchBtn.disabled = false;
      els.priceCardLoadMore.disabled = false;
      priceSearchLoading = false;
    }).catch(function(err){
      els.priceCardSearchBtn.disabled = false;
      els.priceCardLoadMore.disabled = false;
      priceSearchLoading = false;
      els.priceCardResultCount.textContent = "検索に失敗しました: " + friendlyError(err);
    });
  }

  els.priceCardSearchBtn.addEventListener("click", function(){ runPriceCardSearch(false); });
  els.priceCardLoadMore.addEventListener("click", function(){ runPriceCardSearch(true); });
  els.priceCardSearch.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
      e.preventDefault();
      runPriceCardSearch(false);
    }
  });

  // ---- 価格登録の対象カード ----
  function setPriceTarget(cardId, cardName){
    selectedCardId = cardId;
    els.priceTarget.textContent = "対象カード: " + cardName;
    els.priceSubmitBtn.disabled = false;
    els.priceObserved.value = nowForDatetimeLocal();
    clearStatus(els.priceStatus);
  }

  // 価格日時は画面を開いた時点で現在日時を初期値にする
  els.priceObserved.value = nowForDatetimeLocal();

  els.priceForm.addEventListener("submit", function(e){
    e.preventDefault();
    clearStatus(els.priceStatus);

    if(!selectedCardId){
      showStatus(els.priceStatus, "先にカードを選択してください。", true);
      return;
    }
    if(!els.priceSource.value){
      showStatus(els.priceStatus, "価格元を選択してください。", true);
      els.priceSource.focus();
      return;
    }

    var source = priceSourceById[els.priceSource.value];
    var isMercari = !!(source && source.name === "メルカリ");
    var observedIso = els.priceObserved.value ? new Date(els.priceObserved.value).toISOString() : new Date().toISOString();
    var condition = els.priceCondition.value || "default";
    var jobs = [];
    var labels = [];

    if(isMercari){
      var marketPrice = Number(els.priceMarketValue.value);
      if(marketPrice > 0){
        jobs.push(ADMIN.adminRecordPrice({
          cardId: selectedCardId, price: marketPrice, observedAt: observedIso,
          sourceId: els.priceSource.value, priceType: "market", condition: condition
        }));
        labels.push("相場");
      }
    } else {
      var sellPrice = Number(els.priceSellValue.value);
      var buyPrice = Number(els.priceBuyValue.value);
      if(sellPrice > 0){
        jobs.push(ADMIN.adminRecordPrice({
          cardId: selectedCardId, price: sellPrice, observedAt: observedIso,
          sourceId: els.priceSource.value, priceType: "sell", condition: condition
        }));
        labels.push("販売");
      }
      if(buyPrice > 0){
        jobs.push(ADMIN.adminRecordPrice({
          cardId: selectedCardId, price: buyPrice, observedAt: observedIso,
          sourceId: els.priceSource.value, priceType: "buy", condition: condition
        }));
        labels.push("買取");
      }
    }

    if(!jobs.length){
      showStatus(els.priceStatus, isMercari ? "メルカリ相場を入力してください。" : "販売価格か買取価格を1つ以上入力してください。", true);
      return;
    }

    els.priceSubmitBtn.disabled = true;
    Promise.all(jobs).then(function(ids){
      els.priceSubmitBtn.disabled = false;
      var srcName = source ? source.name : "価格元";
      var inserted = ids.filter(function(id){ return !!id; }).length;
      if(inserted > 0){
        showStatus(els.priceStatus, srcName + " の " + labels.join("・") + "価格を登録しました。", false);
        els.priceSellValue.value = "";
        els.priceBuyValue.value = "";
        els.priceMarketValue.value = "";
        els.priceObserved.value = nowForDatetimeLocal();
      } else {
        showStatus(els.priceStatus, "同じ内容の価格が既に登録されています（変更なし）。", false);
      }
      runAdminSearch();
    }).catch(function(err){
      els.priceSubmitBtn.disabled = false;
      showStatus(els.priceStatus, friendlyError(err), true);
    });
  });

})();
</script>
</body>
</html>
