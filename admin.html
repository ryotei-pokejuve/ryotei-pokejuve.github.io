<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 - りょていのサイト</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://idnhamxtwxfcxflenxko.supabase.co;">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
  :root{
    --font-pixel-en: 'Press Start 2P', monospace;
    --font-pixel-jp: 'DotGothic16', sans-serif;
    --bg-outer-1: #7b7bd6;
    --bg-outer-2: #4a4a9c;
    --window-bg: #f8f3e2;
    --window-border-outer: #2a2a4a;
    --window-border-inner: #ffffff;
    --text-color: #24243c;
    --text-sub: #55557a;
    --accent: #3d7fd4;
    --accent-2: #e0663f;
    --ok: #2f8f4e;
    --shadow-color: rgba(0,0,0,.35);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family: var(--font-pixel-jp);
    color: var(--text-color);
    background: linear-gradient(160deg, var(--bg-outer-1), var(--bg-outer-2));
    min-height: 100vh;
  }
  a{ color: var(--accent); }
  button{ font-family: inherit; cursor:pointer; }

  #page-wrap{ max-width: 720px; margin: 0 auto; padding: 14px 12px 40px; }

  .back-link{
    display:inline-block; margin-bottom:8px;
    font-size: 12px; color:#fff; text-decoration:none;
    text-shadow: 2px 2px 0 var(--window-border-outer);
  }
  #brand{
    font-family: var(--font-pixel-en);
    font-size: 13px; color:#fff;
    text-shadow: 2px 2px 0 var(--window-border-outer);
    margin: 0 0 12px;
  }

  .pixel-window{
    background: var(--window-bg);
    border: 4px solid var(--window-border-outer);
    box-shadow: inset 0 0 0 3px var(--window-border-inner), 6px 6px 0 var(--shadow-color);
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .pixel-window h2{
    font-family: var(--font-pixel-en); font-size: 12px; color: var(--accent);
    border-bottom: 3px solid var(--accent); display:inline-block; padding-bottom:4px; margin: 0 0 14px;
  }

  label{ display:block; font-size: 12.5px; color: var(--text-sub); margin: 10px 0 4px; }
  input[type="text"], input[type="email"], input[type="password"], input[type="number"],
  input[type="datetime-local"], input[type="date"], input[type="search"], select, textarea{
    width:100%; padding: 9px; font-family: inherit; font-size: 14px;
    border: 3px solid var(--window-border-outer);
    box-shadow: inset 0 0 0 2px var(--window-border-inner);
    background:#fff; color: var(--text-color);
  }
  textarea{ resize: vertical; min-height: 50px; }
  .custom-field{ display:none; margin-top:6px; }
  .custom-field.open{ display:block; }
  .inline-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:6px; }
  .inline-actions .btn{ margin-top:0; }
  #new-set-panel{
    display:none; margin-top:10px; padding:10px;
    border:2px dashed var(--accent); background:rgba(61,127,212,.08);
  }
  #new-set-panel.open{ display:block; }

  .btn{
    padding: 10px 16px; font-size: 12.5px; min-height:44px;
    background: var(--accent); color:#fff;
    border: 3px solid var(--window-border-outer);
    box-shadow: 3px 3px 0 var(--shadow-color);
    margin-top: 12px; margin-right: 8px;
  }
  .btn:active{ transform: translate(2px,2px); box-shadow:none; }
  .btn.secondary{ background: #8b8bb8; }
  .btn.danger{ background: var(--accent-2); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .status-msg{ margin-top: 10px; padding: 8px 10px; font-size: 12.5px; border: 2px solid; display:none; }
  .status-msg.ok{ display:block; color: var(--ok); border-color: var(--ok); background: rgba(47,143,78,.08); }
  .status-msg.err{ display:block; color: var(--accent-2); border-color: var(--accent-2); background: rgba(224,102,63,.08); }

  #login-section{ max-width: 360px; margin: 40px auto 0; }
  #admin-section{ display:none; }

  #who-row{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
    margin-bottom: 14px; color:#fff; font-size: 12px;
    text-shadow: 1px 1px 0 var(--window-border-outer);
  }

  .search-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .search-row input[type="search"]{ flex: 1 1 160px; }
  .search-row select{ flex: 1 1 120px; }

  #admin-results{ list-style:none; margin: 12px 0 0; padding:0; }
  .result-row{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding: 8px 4px; border-bottom: 1px dotted var(--text-sub); font-size: 13px;
  }
  .result-row .r-name{ flex:1; min-width:0; }
  .result-row button{
    padding: 6px 10px; font-size: 11px; min-height: 36px;
    background: var(--accent); color:#fff; border: 2px solid var(--window-border-outer);
  }

  #image-preview-wrap{ margin-top: 8px; }
  #image-preview{ max-width: 120px; max-height: 160px; border: 2px solid var(--window-border-outer); display:none; }

  #price-target{ font-size: 13px; padding: 8px; background: rgba(61,127,212,.1); border: 2px solid var(--accent); margin-bottom: 8px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div id="page-wrap">
  <a class="back-link" href="index.html">← トップへもどる</a>
  <h1 id="brand">🔧 ADMIN</h1>

  <div id="login-section" class="pixel-window">
    <h2>LOGIN</h2>
    <form id="login-form">
      <label for="login-email">メールアドレス</label>
      <input id="login-email" type="email" autocomplete="username" required>
      <label for="login-password">パスワード</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">ログイン</button>
      <div id="login-status" class="status-msg"></div>
    </form>
  </div>

  <div id="admin-section">
    <div id="who-row">
      <span id="who-am-i"></span>
      <button class="btn secondary" id="logout-btn" type="button">ログアウト</button>
    </div>

    <div class="pixel-window">
      <h2>カード検索</h2>
      <div class="search-row">
        <input id="admin-search-input" type="search" placeholder="カード名・番号で検索">
        <select id="admin-filter-set"><option value="">パック（すべて）</option></select>
        <select id="admin-filter-rarity">
          <option value="">レアリティ（すべて）</option>
          <option value="__NULL__">未設定</option>
          <option value="ー">ー</option>
          <option value="C">C</option>
          <option value="U">U</option>
          <option value="R">R</option>
          <option value="RR">RR</option>
          <option value="RRR">RRR</option>
          <option value="AR">AR</option>
          <option value="SR">SR</option>
          <option value="SAR">SAR</option>
          <option value="UR">UR</option>
          <option value="HR">HR</option>
          <option value="PROMO">PROMO</option>
          <option value="CHR">CHR</option>
          <option value="CSR">CSR</option>
          <option value="S">S</option>
          <option value="SSR">SSR</option>
          <option value="ACE">ACE</option>
          <option value="K">K</option>
          <option value="MUR">MUR</option>
          <option value="BWR">BWR</option>
          <option value="旧裏R">旧裏R</option>
        </select>
        <button class="btn" id="admin-search-btn" type="button">検索</button>
      </div>
      <ul id="admin-results"></ul>
    </div>

    <div class="pixel-window">
      <h2 id="card-form-title">カード新規登録</h2>
      <form id="card-form">
        <input type="hidden" id="card-id">
        <label for="card-set">パック</label>
        <select id="card-set" required></select>
        <div class="inline-actions">
          <button class="btn secondary" type="button" id="new-set-toggle">＋ 新しいパックを追加</button>
        </div>
        <div id="new-set-panel">
          <label for="new-set-code">パックコード</label>
          <input id="new-set-code" type="text" maxlength="40" placeholder="例: SV99">
          <label for="new-set-name">パック名</label>
          <input id="new-set-name" type="text" maxlength="120" placeholder="例: ハイクラスパック ○○">
          <label for="new-set-release-date">発売日（任意）</label>
          <input id="new-set-release-date" type="date">
          <div class="inline-actions">
            <button class="btn" type="button" id="new-set-save">パックを登録</button>
            <button class="btn secondary" type="button" id="new-set-cancel">キャンセル</button>
          </div>
          <div id="new-set-status" class="status-msg"></div>
        </div>
        <label for="card-name">カード名</label>
        <input id="card-name" type="text" required>
        <label for="card-number">番号</label>
        <input id="card-number" type="text" required>
        <label for="card-rarity">レアリティ</label>
        <select id="card-rarity">
          <option value="">未設定</option>
          <option value="ー">ー</option>
          <option value="C">C</option>
          <option value="U">U</option>
          <option value="R">R</option>
          <option value="RR">RR</option>
          <option value="RRR">RRR</option>
          <option value="AR">AR</option>
          <option value="SR">SR</option>
          <option value="SAR">SAR</option>
          <option value="UR">UR</option>
          <option value="HR">HR</option>
          <option value="PROMO">PROMO</option>
          <option value="CHR">CHR</option>
          <option value="CSR">CSR</option>
          <option value="S">S</option>
          <option value="SSR">SSR</option>
          <option value="ACE">ACE</option>
          <option value="K">K</option>
          <option value="MUR">MUR</option>
          <option value="BWR">BWR</option>
          <option value="旧裏R">旧裏R</option>
          <option value="__CUSTOM__">＋ カスタム入力</option>
        </select>
        <div id="card-rarity-custom-wrap" class="custom-field">
          <input id="card-rarity-custom" type="text" maxlength="40" placeholder="例: ☆ / ★ / LEGEND">
        </div>
        <label for="card-variant">バリアント（ホロ・ミラー等の識別。通常は空欄でよい）</label>
        <input id="card-variant" type="text">
        <label for="card-image-url">画像URL（https のみ）</label>
        <input id="card-image-url" type="text" placeholder="https://...">
        <div id="image-preview-wrap"><img id="image-preview" alt="プレビュー"></div>
        <label for="card-image-note">画像の出典メモ（任意）</label>
        <textarea id="card-image-note"></textarea>
        <button class="btn" type="submit" id="card-submit-btn">登録する</button>
        <button class="btn secondary" type="button" id="card-reset-btn">新規登録にリセット</button>
        <div id="card-status" class="status-msg"></div>
      </form>
    </div>

    <div class="pixel-window">
      <h2>価格登録</h2>
      <div id="price-target">カードが選択されていません（上のカード検索・登録から選んでください）</div>
      <form id="price-form">
        <label for="price-value">価格（円）</label>
        <input id="price-value" type="number" min="1" required>
        <label for="price-type">種別</label>
        <select id="price-type">
          <option value="sell">販売</option>
          <option value="buy">買取</option>
        </select>
        <label for="price-condition">状態区分</label>
        <input id="price-condition" type="text" value="default">
        <label for="price-observed">価格の日時</label>
        <input id="price-observed" type="datetime-local">
        <button class="btn" type="submit" id="price-submit-btn" disabled>価格を登録する</button>
        <div id="price-status" class="status-msg"></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha256-7ABBdtEBrsd67vJmqhyUQRKH/iA5xl6l9scvXhSzhH0=" crossorigin="anonymous"></script>
<script src="market.js"></script>
<script src="admin.js"></script>
<script>
(function(){
  "use strict";

  var els = {
    loginSection: document.getElementById("login-section"),
    loginForm: document.getElementById("login-form"),
    loginEmail: document.getElementById("login-email"),
    loginPassword: document.getElementById("login-password"),
    loginStatus: document.getElementById("login-status"),

    adminSection: document.getElementById("admin-section"),
    whoAmI: document.getElementById("who-am-i"),
    logoutBtn: document.getElementById("logout-btn"),

    searchInput: document.getElementById("admin-search-input"),
    filterSet: document.getElementById("admin-filter-set"),
    filterRarity: document.getElementById("admin-filter-rarity"),
    searchBtn: document.getElementById("admin-search-btn"),
    results: document.getElementById("admin-results"),

    cardFormTitle: document.getElementById("card-form-title"),
    cardForm: document.getElementById("card-form"),
    cardId: document.getElementById("card-id"),
    cardSet: document.getElementById("card-set"),
    newSetToggle: document.getElementById("new-set-toggle"),
    newSetPanel: document.getElementById("new-set-panel"),
    newSetCode: document.getElementById("new-set-code"),
    newSetName: document.getElementById("new-set-name"),
    newSetReleaseDate: document.getElementById("new-set-release-date"),
    newSetSave: document.getElementById("new-set-save"),
    newSetCancel: document.getElementById("new-set-cancel"),
    newSetStatus: document.getElementById("new-set-status"),
    cardName: document.getElementById("card-name"),
    cardNumber: document.getElementById("card-number"),
    cardRarity: document.getElementById("card-rarity"),
    cardRarityCustomWrap: document.getElementById("card-rarity-custom-wrap"),
    cardRarityCustom: document.getElementById("card-rarity-custom"),
    cardVariant: document.getElementById("card-variant"),
    cardImageUrl: document.getElementById("card-image-url"),
    imagePreview: document.getElementById("image-preview"),
    cardImageNote: document.getElementById("card-image-note"),
    cardSubmitBtn: document.getElementById("card-submit-btn"),
    cardResetBtn: document.getElementById("card-reset-btn"),
    cardStatus: document.getElementById("card-status"),

    priceTarget: document.getElementById("price-target"),
    priceForm: document.getElementById("price-form"),
    priceValue: document.getElementById("price-value"),
    priceType: document.getElementById("price-type"),
    priceCondition: document.getElementById("price-condition"),
    priceObserved: document.getElementById("price-observed"),
    priceSubmitBtn: document.getElementById("price-submit-btn"),
    priceStatus: document.getElementById("price-status")
  };


  // パックをシリーズ別にまとめてプルダウン表示する。
  // APIがcodeを返す場合はcodeを優先し、返さない場合はnameから判定する。
  function getSetGroup(s){
    var code = String((s && s.code) || "").trim().toUpperCase();
    var name = String((s && s.name) || "").trim();
    var key = code || name.toUpperCase();

    if(/プロモ/.test(name) || /^(SV-P|S-P|SMP|XYP|BWP|DPP|SM-P|XY-P|BW-P|ADV-P)$/.test(code)) return "プロモ";
    if(/^SV/.test(key)) return "SVシリーズ";
    if(/^SM/.test(key)) return "SMシリーズ";
    if(/^XY/.test(key)) return "XYシリーズ";
    if(/^BW/.test(key)) return "BWシリーズ";
    if(/^(DPT|DP)/.test(key)) return "DP・DPtシリーズ";
    if(/^(ADV|PCG)/.test(key)) return "ADV・PCGシリーズ";
    if(/^(PMCG|NEO|E\b|WEB\b|VS\b)/.test(key)) return "旧裏・e・VS";
    if(/^S(?:\d|[A-Z-])/.test(key)) return "Sシリーズ";
    return "その他";
  }

  function setOptionLabel(s){
    var code = String((s && s.code) || "").trim();
    var name = String((s && s.name) || "").trim();
    return code && name && name.indexOf(code) !== 0 ? code + "  " + name : (name || code);
  }

  function appendGroupedSetOptions(select, sets){
    var order = [
      "SVシリーズ", "Sシリーズ", "SMシリーズ", "XYシリーズ", "BWシリーズ",
      "DP・DPtシリーズ", "ADV・PCGシリーズ", "旧裏・e・VS", "プロモ", "その他"
    ];
    var groups = {};
    order.forEach(function(label){ groups[label] = []; });

    (sets || []).forEach(function(s){
      groups[getSetGroup(s)].push(s);
    });

    order.forEach(function(label){
      if(!groups[label].length) return;
      groups[label].sort(function(a, b){
        return setOptionLabel(a).localeCompare(setOptionLabel(b), "ja", { numeric: true });
      });
      var group = document.createElement("optgroup");
      group.label = label;
      groups[label].forEach(function(s){
        var opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = setOptionLabel(s);
        group.appendChild(opt);
      });
      select.appendChild(group);
    });
  }

  var selectedCardId = null;
  var setsLoaded = false;

  function showStatus(el, message, isError){
    el.textContent = message;
    el.className = "status-msg " + (isError ? "err" : "ok");
  }
  function clearStatus(el){
    el.textContent = "";
    el.className = "status-msg";
  }

  // よくあるDBエラーメッセージを分かりやすい日本語にする
  function friendlyError(err){
    var msg = (err && err.message) || String(err);
    if(msg.indexOf("not authorized") !== -1) return "管理者権限がありません。管理者アカウントでログインしているか確認してください。";
    if(msg.indexOf("price must be positive") !== -1) return "価格は1円以上で入力してください。";
    if(msg.indexOf("observed_at is invalid") !== -1) return "日時が不正か、未来すぎます。";
    if(msg.indexOf("card not found") !== -1) return "対象のカードが見つかりませんでした。";
    if(msg.indexOf("set_id, name, card_number are required") !== -1) return "パック・カード名・番号は必須です。";
    return msg;
  }

  function nowForDatetimeLocal(){
    var d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  }

  // ---- ログイン状態の切り替え ----
  // ログアウト状態（初期表示・手動ログアウト・セッション失効・管理者以外のログイン、すべて共通）に
  // 戻すときは、フォームや検索結果、選択中カードなど画面上の情報を必ずクリアする。
  function showLoggedOut(){
    els.loginSection.style.display = "block";
    els.adminSection.style.display = "none";
    els.loginPassword.value = "";
    els.results.innerHTML = "";
    resetCardForm();
  }
  function showLoggedIn(session){
    els.loginSection.style.display = "none";
    els.adminSection.style.display = "block";
    els.whoAmI.textContent = "ログイン中: " + (session && session.user && session.user.email || "");
    if(!setsLoaded){
      setsLoaded = true;
      loadCardSets();
    }
    runAdminSearch();
  }

  // ログイン済みでも、実際に管理者（admin_users登録済み）でなければ管理UIを表示しない。
  // 判定自体はDB側（is_admin）が最終的な境界であり、これはあくまでUIの出し分け。
  function handleSessionChange(session){
    if(!session){
      showLoggedOut();
      return;
    }
    ADMIN.checkAdminAccess().then(function(isAdmin){
      if(isAdmin){
        showLoggedIn(session);
      } else {
        ADMIN.logout().then(function(){
          showLoggedOut();
          showStatus(els.loginStatus, "このアカウントには管理者権限がありません。", true);
        });
      }
    }).catch(function(err){
      console.error(err);
      ADMIN.logout().then(function(){
        showLoggedOut();
        showStatus(els.loginStatus, "権限の確認に失敗しました。もう一度ログインしてください。", true);
      });
    });
  }

  ADMIN.getSession().then(handleSessionChange);
  ADMIN.onAuthChange(handleSessionChange);

  els.loginForm.addEventListener("submit", function(e){
    e.preventDefault();
    clearStatus(els.loginStatus);
    ADMIN.login(els.loginEmail.value, els.loginPassword.value).catch(function(err){
      showStatus(els.loginStatus, friendlyError(err) === err.message ? "ログインに失敗しました（メールアドレスかパスワードが違います）。" : friendlyError(err), true);
    });
  });

  els.logoutBtn.addEventListener("click", function(){
    ADMIN.logout();
  });

  // ---- パック一覧の読み込み（検索フィルタ・登録フォーム両方で使う） ----
  function clearSetOptions(select, firstLabel){
    select.innerHTML = "";
    var first = document.createElement("option");
    first.value = "";
    first.textContent = firstLabel;
    select.appendChild(first);
  }

  function loadCardSets(selectCardId){
    return MARKET.listCardSets().then(function(sets){
      var previousFilter = els.filterSet.value;
      var previousCard = selectCardId || els.cardSet.value;

      clearSetOptions(els.filterSet, "パック（すべて）");
      clearSetOptions(els.cardSet, "パックを選択");

      appendGroupedSetOptions(els.filterSet, sets);
      appendGroupedSetOptions(els.cardSet, sets);

      if(previousFilter) els.filterSet.value = previousFilter;
      if(previousCard) els.cardSet.value = previousCard;

      return sets;
    }).catch(function(err){
      console.error(err);
      throw err;
    });
  }

  // ---- 新しいパックの追加 ----
  function setNewSetPanel(open){
    els.newSetPanel.classList.toggle("open", !!open);
    if(open){
      clearStatus(els.newSetStatus);
      els.newSetName.focus();
    }
  }

  els.newSetToggle.addEventListener("click", function(){
    setNewSetPanel(!els.newSetPanel.classList.contains("open"));
  });

  els.newSetCancel.addEventListener("click", function(){
    setNewSetPanel(false);
    els.newSetCode.value = "";
    els.newSetName.value = "";
    els.newSetReleaseDate.value = "";
    clearStatus(els.newSetStatus);
  });

  els.newSetSave.addEventListener("click", function(){
    clearStatus(els.newSetStatus);

    var name = els.newSetName.value.trim();
    var code = els.newSetCode.value.trim();
    var releaseDate = els.newSetReleaseDate.value || null;

    if(!name){
      showStatus(els.newSetStatus, "パック名を入力してください。", true);
      els.newSetName.focus();
      return;
    }

    els.newSetSave.disabled = true;
    ADMIN.adminCreateCardSet({
      code: code,
      name: name,
      releaseDate: releaseDate
    }).then(function(newSetId){
      return loadCardSets(newSetId).then(function(){
        els.newSetSave.disabled = false;
        els.cardSet.value = newSetId;
        showStatus(els.newSetStatus, "パックを登録しました。このパックを選択しています。", false);
        els.newSetCode.value = "";
        els.newSetName.value = "";
        els.newSetReleaseDate.value = "";
      });
    }).catch(function(err){
      els.newSetSave.disabled = false;
      var msg = friendlyError(err);
      if(String(msg).indexOf("duplicate") !== -1 || String(msg).indexOf("unique") !== -1){
        msg = "同じパックコードがすでに登録されています。";
      }
      showStatus(els.newSetStatus, msg, true);
    });
  });

  // ---- カード検索（一般公開のsearch_cardsを流用。閲覧は管理者以外もできる情報なので問題ない） ----
  function runAdminSearch(){
    MARKET.searchCards({
      query: els.searchInput.value,
      rarity: els.filterRarity.value || null,
      setId: els.filterSet.value || null,
      limit: 20,
      offset: 0
    }).then(function(rows){
      els.results.innerHTML = "";
      rows.forEach(function(card){
        var li = document.createElement("li");
        li.className = "result-row";

        var nameSpan = document.createElement("span");
        nameSpan.className = "r-name";
        nameSpan.textContent = card.name + "（" + (card.card_number || "") + (card.rarity ? " / " + card.rarity : "") + "）";
        li.appendChild(nameSpan);

        var editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.textContent = "編集";
        editBtn.addEventListener("click", function(){ loadCardForEdit(card.id); });
        li.appendChild(editBtn);

        els.results.appendChild(li);
      });
    }).catch(function(err){ console.error(err); });
  }
  els.searchBtn.addEventListener("click", runAdminSearch);
  els.filterSet.addEventListener("change", runAdminSearch);
  els.filterRarity.addEventListener("change", runAdminSearch);

  // ---- カスタムレアリティ ----
  function isBuiltInRarity(value){
    var builtIn = ["", "ー", "C", "U", "R", "RR", "RRR", "AR", "SR", "SAR", "UR", "HR",
      "PROMO", "CHR", "CSR", "S", "SSR", "ACE", "K", "MUR", "BWR", "旧裏R"];
    return builtIn.indexOf(value || "") !== -1;
  }

  function updateCustomRarityUI(){
    var custom = els.cardRarity.value === "__CUSTOM__";
    els.cardRarityCustomWrap.classList.toggle("open", custom);
    if(custom){
      els.cardRarityCustom.focus();
    }
  }

  function getCardRarityValue(){
    if(els.cardRarity.value !== "__CUSTOM__"){
      return els.cardRarity.value;
    }
    return els.cardRarityCustom.value.trim();
  }

  function setCardRarityValue(value){
    value = value || "";
    if(isBuiltInRarity(value)){
      els.cardRarity.value = value;
      els.cardRarityCustom.value = "";
    } else {
      els.cardRarity.value = "__CUSTOM__";
      els.cardRarityCustom.value = value;
    }
    updateCustomRarityUI();
  }

  els.cardRarity.addEventListener("change", updateCustomRarityUI);

  // ---- カード編集フォームへの読み込み ----
  function loadCardForEdit(cardId){
    clearStatus(els.cardStatus);
    ADMIN.adminGetCard(cardId).then(function(card){
      if(!card){
        showStatus(els.cardStatus, "カードが見つかりませんでした。", true);
        return;
      }
      els.cardFormTitle.textContent = "カード編集";
      els.cardSubmitBtn.textContent = "更新する";
      els.cardId.value = card.id;
      els.cardSet.value = card.set_id;
      els.cardName.value = card.name || "";
      els.cardNumber.value = card.card_number || "";
      setCardRarityValue(card.rarity || "");
      els.cardVariant.value = card.variant || "";
      els.cardImageUrl.value = card.image_url || "";
      els.cardImageNote.value = card.image_source_note || "";
      updateImagePreview();
      setPriceTarget(card.id, card.name);
    }).catch(function(err){
      showStatus(els.cardStatus, friendlyError(err), true);
    });
  }

  function resetCardForm(){
    els.cardFormTitle.textContent = "カード新規登録";
    els.cardSubmitBtn.textContent = "登録する";
    els.cardForm.reset();
    els.cardId.value = "";
    els.cardRarityCustom.value = "";
    setNewSetPanel(false);
    updateCustomRarityUI();
    updateImagePreview();
    clearStatus(els.cardStatus);
    // 誤って別のカードに価格を登録してしまわないよう、価格登録の対象も必ずリセットする
    clearPriceTarget();
  }
  els.cardResetBtn.addEventListener("click", resetCardForm);

  function clearPriceTarget(){
    selectedCardId = null;
    els.priceTarget.textContent = "カードが選択されていません（上のカード検索・登録から選んでください）";
    els.priceSubmitBtn.disabled = true;
    els.priceForm.reset();
    clearStatus(els.priceStatus);
  }

  // ---- 画像URLのプレビュー（表示前に必ずsanitizeImageUrlを通す） ----
  function updateImagePreview(){
    var safeUrl = MARKET.sanitizeImageUrl(els.cardImageUrl.value);
    if(safeUrl){
      els.imagePreview.src = safeUrl;
      els.imagePreview.style.display = "block";
    } else {
      els.imagePreview.removeAttribute("src");
      els.imagePreview.style.display = "none";
    }
  }
  els.cardImageUrl.addEventListener("input", updateImagePreview);

  // ---- カード登録・更新 ----
  els.cardForm.addEventListener("submit", function(e){
    e.preventDefault();
    clearStatus(els.cardStatus);
    if(!els.cardSet.value){
      showStatus(els.cardStatus, "パックを選択してください。", true);
      return;
    }
    var rarityValue = getCardRarityValue();
    if(els.cardRarity.value === "__CUSTOM__" && !rarityValue){
      showStatus(els.cardStatus, "カスタムレアリティを入力してください。", true);
      els.cardRarityCustom.focus();
      return;
    }

    els.cardSubmitBtn.disabled = true;
    ADMIN.adminUpsertCard({
      id: els.cardId.value || null,
      setId: els.cardSet.value,
      name: els.cardName.value,
      cardNumber: els.cardNumber.value,
      rarity: rarityValue,
      variant: els.cardVariant.value,
      imageUrl: els.cardImageUrl.value,
      imageSourceNote: els.cardImageNote.value
    }).then(function(newId){
      els.cardSubmitBtn.disabled = false;
      if(!newId){
        // 通常はDB側でエラーになるためここには来ないはずだが、念のための防御
        showStatus(els.cardStatus, "保存に失敗しました（対象のカードが見つかりませんでした）。", true);
        return;
      }
      showStatus(els.cardStatus, "保存しました。", false);
      els.cardId.value = newId;
      els.cardFormTitle.textContent = "カード編集";
      els.cardSubmitBtn.textContent = "更新する";
      setPriceTarget(newId, els.cardName.value);
      runAdminSearch();
    }).catch(function(err){
      els.cardSubmitBtn.disabled = false;
      showStatus(els.cardStatus, friendlyError(err), true);
    });
  });

  // ---- 価格登録の対象カード ----
  function setPriceTarget(cardId, cardName){
    selectedCardId = cardId;
    els.priceTarget.textContent = "対象カード: " + cardName;
    els.priceSubmitBtn.disabled = false;
    els.priceObserved.value = nowForDatetimeLocal();
    clearStatus(els.priceStatus);
  }

  els.priceForm.addEventListener("submit", function(e){
    e.preventDefault();
    clearStatus(els.priceStatus);
    if(!selectedCardId){
      showStatus(els.priceStatus, "先にカードを選択してください。", true);
      return;
    }
    els.priceSubmitBtn.disabled = true;
    var observedIso = els.priceObserved.value ? new Date(els.priceObserved.value).toISOString() : new Date().toISOString();
    ADMIN.adminRecordPrice({
      cardId: selectedCardId,
      price: Number(els.priceValue.value),
      observedAt: observedIso,
      priceType: els.priceType.value,
      condition: els.priceCondition.value || "default"
    }).then(function(newId){
      els.priceSubmitBtn.disabled = false;
      if(newId){
        showStatus(els.priceStatus, "価格を登録しました。", false);
      } else {
        showStatus(els.priceStatus, "同じ内容の価格が既に登録されています（変更なし）。", false);
      }
      runAdminSearch();
    }).catch(function(err){
      els.priceSubmitBtn.disabled = false;
      showStatus(els.priceStatus, friendlyError(err), true);
    });
  });

})();
</script>
</body>
</html>
